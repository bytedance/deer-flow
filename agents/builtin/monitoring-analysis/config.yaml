  - label: "多参数关联分析"
    prompt: "分析多参数关联关系"
    auto_start: false
  - label: "波形频谱分析"
    prompt: "分析设备波形频谱特征"
    auto_start: false
  # Pro 能力等级 starters（monitoring:pro 工具组启用时可用）
  - label: "Pro 多维度趋势分析"
    prompt: "对所选设备进行多维度趋势分析，包含多模型对比和变点检测"
    auto_start: false
    tool_groups: [monitoring:pro]
  - label: "Pro 智能异常检测"
    prompt: "使用 Isolation Forest 和 DBSCAN 聚类进行智能异常检测"
    auto_start: false
    tool_groups: [monitoring:pro]
  - label: "Pro 健康评分与关联"
