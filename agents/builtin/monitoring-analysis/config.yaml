    auto_start: false
    tool_groups: [monitoring:pro]
  # Ultra 能力等级 starters（monitoring:ultra 工具组启用时可用）
  - label: "Ultra 全景驾驶舱"
    prompt: "生成全景驾驶舱视图：风险矩阵 + 健康仪表 + 异常表 + 趋势图"
    auto_start: false
    tool_groups: [monitoring:ultra]
  - label: "Ultra 预测性健康评估"
    prompt: "使用 LSTM 和 Autoencoder 进行预测性健康评估和根因分析"
    auto_start: false
    tool_groups: [monitoring:ultra]
  - label: "Ultra 因果关联分析"
    prompt: "使用 Granger 因果检验和传递熵分析参数间因果关联"
    auto_start: false
    tool_groups: [monitoring:ultra]
advanced:
