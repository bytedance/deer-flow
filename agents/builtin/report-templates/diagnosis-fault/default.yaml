dsl_version: "1"
name: diagnosis-fault
display_name: "故障诊断报告"
description: "面向具体故障的诊断报告：根据故障对象、时间、现象，输出时间线、影响评估、候选根因（含证据链）和处理建议。属于 §13.2 解释性报告：每条 finding 至少 2 条 evidence，且 source_type 联合覆盖 timeseries / alarm / work_order / maintenance_record。"
visibility: builtin

form_steps:
  - id: scope
    title: 生成故障诊断报告
    description: 请填写故障对象、时间和主要现象。
    fields:
      - name: equipment_id
        label: 故障对象 ID
        type: text
        required: true
        placeholder: "例如 P-001"
        validation:
          pattern: "^[A-Za-z0-9_-]+$"
      - name: fault_time
        label: 故障发生日
        type: date
        required: true
      - name: symptom
        label: 现象描述
        type: textarea
        required: true
        placeholder: "请用一句话描述故障现象，例如：振动异常、压力波动等"
      - name: include_related
        label: 是否包含关联设备
        type: checkbox
        default: false
        description: "勾选后会在诊断时纳入辅机/备机数据"
    next: generate

data_steps:
  - id: fault_context
    kind: script
    name: data-analyst/query_fault_context
    args:
      fault_time: "{{ $.form.scope.fault_time }}"
      equipment_id: "{{ $.form.scope.equipment_id }}"
      symptom: "{{ $.form.scope.symptom }}"
      include_related_equipment: "{{ $.form.scope.include_related }}"
    outputs:
      fault_context: fault_context.json

transforms:
  - id: fault_timeline
    kind: script
    name: data-analyst/build_fault_timeline
    input: fault_context.fault_context
    outputs:
      fault_timeline: fault_timeline.json

  - id: diagnosis_analysis
    kind: script
    name: data-analyst/diagnosis_analysis
    input: fault_context.fault_context
    args:
      timeline: "{{ $.steps.fault_timeline.fault_timeline }}"
    outputs:
      diagnosis_analysis: diagnosis_analysis.json

sections:
  # Section 1: human-review banner (§13.2 mandate)
  - id: review_banner
    title: 人工复核提示
    component: card
    source: $.steps.diagnosis_analysis.diagnosis_analysis.human_review_required
    props:
      style: warning
      template: "本报告为 §13.2 解释性报告，诊断结论需现场专家复核后方可作为正式输出。"

  # Section 2: single-line overall summary (digest card)
  - id: overview
    title: 故障概述
    component: card
    source: $.steps.diagnosis_analysis.diagnosis_analysis.overall_status

  # Section 3: impact card
  - id: impact
    title: 影响评估
    component: card
    source: $.steps.diagnosis_analysis.diagnosis_analysis.impact_assessment

  # Section 4: timeline (sorted events with source_type/source_id)
  - id: timeline
    title: 事件时间线
    component: table
    source: $.steps.fault_timeline.fault_timeline.timeline
    props:
      columns:
        - { key: t, label: 时间 }
        - { key: type, label: 类型 }
        - { key: level, label: 级别 }
        - { key: label, label: 说明 }
        - { key: source_type, label: 来源类型 }
        - { key: source_id, label: 来源 ID }

  # Section 5: alarm flow (factual table)
  - id: alarms
    title: 关联告警
    component: table
    source: $.steps.diagnosis_analysis.diagnosis_analysis.alarm_table
    props:
      columns:
        - { key: id, label: 告警 ID }
        - { key: time, label: 时间 }
        - { key: equipment, label: 设备 }
        - { key: level, label: 级别 }
        - { key: message, label: 描述 }

  # Section 6: candidate root causes (findings table)
  - id: findings
    title: 候选根因 (Findings)
    component: table
    source: $.steps.diagnosis_analysis.diagnosis_analysis.findings
    props:
      columns:
        - { key: id, label: 编号 }
        - { key: label, label: 根因 }
        - { key: likelihood, label: 可能性 }
        - { key: severity, label: 严重度 }
        - { key: is_primary, label: 优先排查 }
        - { key: rationale, label: 推理依据 }

  # Section 7: evidence chain — links back to findings via finding_id
  - id: evidence
    title: 证据链 (Evidence Trail)
    component: table
    source: $.steps.diagnosis_analysis.diagnosis_analysis.evidence
    props:
      columns:
        - { key: finding_id, label: 关联根因 }
        - { key: source_type, label: 来源类型 }
        - { key: source_id, label: 来源 ID }
        - { key: snapshot_path, label: 快照路径 }
        - { key: checksum, label: 校验和 }
        - { key: description, label: 备注 }

  # Section 8: data coverage card
  - id: data_coverage
    title: 数据覆盖
    component: card
    source: $.steps.diagnosis_analysis.diagnosis_analysis.data_coverage

  # Section 9: assumptions
  - id: assumptions
    title: 分析假设
    component: markdown
    source: $.steps.diagnosis_analysis.diagnosis_analysis.assumptions

  # Section 10: recommendations
  - id: recommendations
    title: 处置建议
    component: markdown
    source: $.steps.diagnosis_analysis.diagnosis_analysis.recommendations

export:
  formats: [md, pdf]
  renderer: generic_report
