dsl_version: "1"
name: weekly-equipment
display_name: "设备运行周报"
description: "面向自然周或自定义 7 天窗口的设备周报：周期 → 设备 → KPI → 生成。复用日报的设备/KPI 选择体系，仅扩展时间窗口和聚合逻辑。"
visibility: builtin

form_steps:
  - id: scope
    title: 生成设备运行周报
    description: 请选择周开始日期、设备类型和对比基准。
    fields:
      - name: week_start
        label: 周开始日期
        type: date
        required: true
        description: "建议选择周一"
      - name: equipment_type
        label: 设备类型
        type: select
        required: true
        default: all
        options:
          - { label: 全部, value: all }
          - { label: 静设备, value: static_equipment }
          - { label: 旋转机组, value: rotating_machinery }
          - { label: 机泵, value: pump }
          - { label: 往复机组, value: reciprocating_machinery }
      - name: compare_with
        label: 对比基准
        type: select
        required: true
        default: previous_week
        options:
          - { label: 上一周, value: previous_week }
          - { label: 去年同期, value: previous_year }
          - { label: 不对比, value: none }
    next: equipment

  - id: equipment
    title: 选择设备
    description: 请在左侧组织树中选择本周报告覆盖的设备，点击"确认选择"提交。
    component: device-selector-multi
    device_filter:
      type_id_from: scope.equipment_type
    max_select: 100
    next: kpis

  - id: kpis
    title: 选择 KPI
    description: 请选择本周关注的指标。
    before_step:
      id: kpi_catalog
      kind: script
      name: data-analyst/list_equipment
      args:
        type: "{{ $.form.scope.equipment_type }}"
        scope: all
        limit: 10000
    fields:
      - name: kpi_keys
        label: KPI 指标
        type: multi-select
        required: true
        options_source:
          step: kpi_catalog
          path: available_kpis
          label: label
          value: key
          description: description
    next: generate

data_steps:
  - id: weekly_data
    kind: script
    name: data-analyst/query_weekly
    args:
      week_start: "{{ $.form.scope.week_start }}"
      type: "{{ $.form.scope.equipment_type }}"
      equipment: "{{ $.form.equipment.equipment_ids }}"
      kpis: "{{ $.form.kpis.kpi_keys }}"
      compare: "{{ $.form.scope.compare_with }}"
    outputs:
      weekly_data: weekly_data.json

transforms:
  - id: weekly_kpi
    kind: script
    name: data-analyst/weekly_kpi
    input: weekly_data.weekly_data
    outputs:
      weekly_kpi: weekly_kpi.json

sections:
  - id: overview
    title: 本周运行概览
    component: markdown
    source: $.steps.weekly_kpi.weekly_kpi.overall_status.summary

  - id: kpi_cards
    title: 核心 KPI 周统计
    component: card_group
    source: $.steps.weekly_kpi.weekly_kpi.kpi_summary

  - id: daily_trend
    title: 每日趋势
    component: echart
    source: $.steps.weekly_kpi.weekly_kpi.trend_chart

  - id: anomalies
    title: 异常 TopN
    component: table
    source: $.steps.weekly_kpi.weekly_kpi.top_anomalies

  - id: compare
    title: 与上一周对比
    component: card_group
    source: $.steps.weekly_kpi.weekly_kpi.compare_summary

  - id: next_focus
    title: 下周关注重点
    component: markdown
    source: $.steps.weekly_kpi.weekly_kpi.next_focus

export:
  formats: [md, pdf]
  renderer: generic_report
