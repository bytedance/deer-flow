dsl_version: "1"
name: trend-equipment
display_name: "设备趋势分析报告"
description: "对指定指标和时间窗口做趋势分解、异常检测、预测预警。属于 §13.2 解释性报告：包含 evidence/confidence/data_coverage/human_review_required 五字段契约。"
visibility: builtin

form_steps:
  - id: scope
    title: 生成趋势分析报告
    description: 请选择时间窗口、聚合粒度和预测周期。
    fields:
      - name: date_range
        label: 时间窗口
        type: text
        required: true
        placeholder: "YYYY-MM-DD..YYYY-MM-DD"
        description: "起止日期，如 2026-01-01..2026-05-18"
        validation:
          pattern: "^\\d{4}-\\d{2}-\\d{2}\\.\\.\\d{4}-\\d{2}-\\d{2}$"
      - name: aggregation
        label: 聚合粒度
        type: select
        required: true
        default: daily
        options:
          - { label: 小时, value: hourly }
          - { label: 天, value: daily }
          - { label: 周, value: weekly }
      - name: forecast_horizon
        label: 预测周期
        type: number
        required: true
        default: 7
        description: "向后预测的周期数 (0~90，单位由聚合粒度决定)"
        validation:
          min: 0
          max: 90
    next: kpis

  - id: kpis
    title: 选择 KPI 指标
    description: 请选择需要分析趋势的指标。
    before_step:
      id: kpi_catalog
      kind: script
      name: data-analyst/list_equipment
      args:
        type: all
        scope: all
        limit: 10000
    fields:
      - name: metric_keys
        label: 指标列表
        type: multi-select
        required: true
        searchable: true
        options_source:
          step: kpi_catalog
          path: available_kpis
          label: label
          value: key
          description: description
    next: generate

data_steps:
  - id: trend_data
    kind: script
    name: data-analyst/query_trend
    args:
      metric_keys: "{{ $.form.kpis.metric_keys }}"
      date_range: "{{ $.form.scope.date_range }}"
      aggregation: "{{ $.form.scope.aggregation }}"
      forecast_horizon: "{{ $.form.scope.forecast_horizon }}"
    outputs:
      trend_data: trend_data.json

transforms:
  - id: trend_analysis
    kind: script
    name: data-analyst/trend_analysis
    input: trend_data.trend_data
    outputs:
      trend_analysis: trend_analysis.json

sections:
  # Section 1: human_review banner (rendered as a card so it lands above narrative)
  - id: review_banner
    title: 人工复核提示
    component: card
    source: $.steps.trend_analysis.trend_analysis.human_review_required
    props:
      style: warning
      template: "本报告为 §13.2 解释性报告，结论需人工复核后方可作为正式输出。"

  # Section 2: overall_status — single-line digest card
  - id: overview
    title: 趋势概览
    component: card
    source: $.steps.trend_analysis.trend_analysis.overall_status

  # Section 3: findings table (kind / severity / headline)
  - id: findings
    title: 趋势发现 (Findings)
    component: table
    source: $.steps.trend_analysis.trend_analysis.findings
    props:
      columns:
        - { key: id, label: 编号 }
        - { key: metric_name, label: 指标 }
        - { key: kind, label: 类型 }
        - { key: severity, label: 严重度 }
        - { key: headline, label: 说明 }

  # Section 4: evidence chain (each row points back to a finding_id)
  - id: evidence
    title: 证据链 (Evidence Trail)
    component: table
    source: $.steps.trend_analysis.trend_analysis.evidence
    props:
      columns:
        - { key: finding_id, label: 关联发现 }
        - { key: source_type, label: 来源类型 }
        - { key: source_id, label: 来源 ID }
        - { key: snapshot_path, label: 快照路径 }
        - { key: checksum, label: 校验和 }
        - { key: description, label: 备注 }

  # Section 5: trend chart (full ECharts option, no re-assembly)
  - id: trend_chart
    title: 指标趋势 + 预测
    component: echart
    source: $.steps.trend_analysis.trend_analysis.trend_chart

  # Section 6: alert list (high-severity flat table)
  - id: alerts
    title: 高严重度告警
    component: table
    source: $.steps.trend_analysis.trend_analysis.alert_list
    props:
      columns:
        - { key: metric_name, label: 指标 }
        - { key: kind, label: 类型 }
        - { key: severity, label: 严重度 }
        - { key: headline, label: 说明 }

  # Section 7: data coverage card group
  - id: data_coverage
    title: 数据覆盖
    component: card
    source: $.steps.trend_analysis.trend_analysis.data_coverage

  # Section 8: confidence + assumptions
  - id: confidence
    title: 置信度与假设
    component: markdown
    source: $.steps.trend_analysis.trend_analysis.assumptions

  # Section 9: recommendations
  - id: recommendations
    title: 改进建议
    component: markdown
    source: $.steps.trend_analysis.trend_analysis.recommendations

export:
  formats: [md, pdf]
  renderer: generic_report
