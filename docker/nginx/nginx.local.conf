# Global error_log (main context). Without this, nginx opens its compiled-in
# default (/var/log/nginx/error.log) at startup before reaching the http-block
# error_log, which fails with permission denied when run as a non-root user.
error_log logs/nginx-error.log warn;
events {
    worker_connections 1024;
}
pid logs/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compress textual delivery only. SSE and already-compressed media are
    # deliberately absent because buffering/compression hurts their latency.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Logging
    # Share URLs carry the raw bearer token in the path (#4548). Classify the
    # normalized URI so reversible percent-encoding of the route cannot evade
    # masking, then render only a constant route label. A second raw-request
    # guard drops any bearer that appears elsewhere, including a query string.
    map $uri $share_log_path {
        default                    "";
        "~^/share/"                "/share/***";
        "~^/api/shares/"           "/api/shares/***";
    }
    map $request $request_has_share_token {
        default 0;
        "~*(?:d|%64)(?:f|%66)(?:s|%73)(?:_|%5f)(?:[A-Za-z0-9_-]|%[0-9a-f]{2})+" 1;
    }
    map "$share_log_path:$request_has_share_token" $masked_request {
        default             $request;
        "/share/***:0"     "$request_method $share_log_path $server_protocol";
        "/share/***:1"     "$request_method $share_log_path $server_protocol";
        "/api/shares/***:0" "$request_method $share_log_path $server_protocol";
        "/api/shares/***:1" "$request_method $share_log_path $server_protocol";
        ":1"                "$request_method *** $server_protocol";
    }
    # Referer is client-controlled and can carry the same bearer URL even when
    # the current request is harmless (for example, /favicon.ico). Drop the
    # whole sensitive value so unusual URL suffixes cannot bypass redaction.
    map $http_referer $masked_referer {
        default $http_referer;
        "~*(?:d|%64)(?:f|%66)(?:s|%73)(?:_|%5f)(?:[A-Za-z0-9_-]|%[0-9a-f]{2})+" dfs_***;
    }
    map $http_user_agent $masked_user_agent {
        default $http_user_agent;
        "~*(?:d|%64)(?:f|%66)(?:s|%73)(?:_|%5f)(?:[A-Za-z0-9_-]|%[0-9a-f]{2})+" dfs_***;
    }
    map $remote_user $masked_remote_user {
        default $remote_user;
        "~*(?:d|%64)(?:f|%66)(?:s|%73)(?:_|%5f)(?:[A-Za-z0-9_-]|%[0-9a-f]{2})+" dfs_***;
    }
    # Keep the combined-log shape while masking every logged field that can
    # carry a client-supplied bearer: request, remote user, Referer, and UA.
    log_format masked_access '$remote_addr - $masked_remote_user [$time_local] "$masked_request" $status $body_bytes_sent "$masked_referer" "$masked_user_agent"';
    access_log logs/nginx-access.log masked_access;
    error_log logs/nginx-error.log;

    # Upstream servers (using 127.0.0.1 for local development)
    upstream gateway {
        server 127.0.0.1:8001;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    # Only mark frontend requests as connection upgrades when the browser
    # actually requested one. Next.js dev HMR also uses long-lived HTTP
    # streams, and forcing "Connection: upgrade" on those requests makes
    # nginx treat the upstream response as an invalid upgrade handshake.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 2026;
        listen [::]:2026;
        server_name _;

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            # Long chat/text-prompt support (issue #3952): a sufficiently long
            # pasted prompt otherwise exceeds nginx's default 1m
            # client_max_body_size, or gets spooled to a temp file via
            # proxy_request_buffering before reaching Gateway -- on a non-root
            # local run that temp directory may not be writable, producing a
            # raw nginx 500 instead of a graceful application error. Mirrors
            # the uploads location's fix below (same mechanism, sized for text
            # prompts rather than binary file uploads).
            client_max_body_size 20M;
            proxy_request_buffering off;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;

            # Disable response buffering to avoid permission errors
            proxy_buffering off;
            proxy_cache off;
        }

        # Live browser stream is a WebSocket upgrade. It must be matched before
        # the generic /api/threads regex below (which omits Upgrade/Connection
        # forwarding and would downgrade it to plain HTTP).
        location ~ ^/api/threads/[^/]+/browser/stream {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Long-lived Live stream: keep the upgraded connection open.
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: Swagger UI
        location /api/docs {
            proxy_pass http://gateway/docs  ;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: ReDoc
        location /api/redoc {
            proxy_pass http://gateway/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
        }

        # Catch-all for any /api/* prefix not matched by a more specific block above.
        # Covers the auth module (/api/v1/auth/login, /me, /change-password, ...),
        # plus feedback / runs / token-usage routes that 2.0-rc added without
        # updating this nginx config. Longest-prefix matching ensures the explicit
        # blocks above (/api/models, /api/threads regex, /api/langgraph/, ...) still
        # win for their paths — only truly unmatched /api/* requests land here.
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Auth endpoints set HttpOnly cookies — make sure nginx doesn't
            # strip the Set-Cookie header from upstream responses.
            proxy_pass_header Set-Cookie;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            proxy_buffering off;
            proxy_cache off;
        }

        # Share token surfaces (#4548): the bearer token in the URL path is
        # the sole credential for the snapshot. access_log masking is set at
        # the http level. nginx error messages embed the full request line,
        # severity does NOT redact it (crit-level request-processing
        # failures still append `request: "GET ..."` — nginx trac #2193),
        # and error_log output cannot be format-masked — so these locations
        # route their error_log to /dev/null: a sink that cannot retain the
        # token. Trade-off: upstream-failure diagnostics for share routes
        # are lost (the Gateway still logs its own side). ^~ pins these
        # paths so no later regex location can shadow the share surface.
        location ^~ /api/shares/ {
            error_log /dev/null crit;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            proxy_buffering off;
            proxy_cache off;
        }

        location ^~ /share/ {
            error_log /dev/null crit;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Same non-root buffering rationale as the catch-all below.
            proxy_buffering off;
            proxy_cache off;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Disable response buffering for the frontend. Without this,
            # nginx tries to spool large upstream responses (e.g. Next.js
            # static chunks) into ``proxy_temp_path``, which defaults to
            # the system-owned ``/var/lib/nginx/proxy`` and fails with
            # ``[crit] open() ... failed (13: Permission denied)`` when
            # nginx is launched as a non-root user (every dev machine
            # except production root containers). The symptom on the
            # client side is ``ERR_INCOMPLETE_CHUNKED_ENCODING`` and
            # ``ChunkLoadError`` partway through page hydration.
            #
            # Streaming the response straight through avoids the
            # temp-file path entirely. The frontend already sets its
            # own cache headers, so we don't lose anything from
            # disabling nginx-side buffering.
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
