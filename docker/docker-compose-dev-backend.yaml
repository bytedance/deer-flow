# DeerFlow Backend Dev: Backend (hot-reload) + nginx (with pre-built frontend dist)
# Usage:
#   1. Build frontend dist:  make docker-build-frontend-dist
#   2. Extract dist:         docker compose -p deer-flow-dev-backend -f docker-compose-dev-backend.yaml run --rm frontend-dist
#   3. Start services:       docker compose -p deer-flow-dev-backend -f docker-compose-dev-backend.yaml up -d --remove-orphans gateway nginx
#   Or simply:              make docker-start-backend-dev
#
# Services:
#   - frontend-dist: One-shot init container that extracts pre-built frontend dist to shared volume
#   - nginx:         Reverse proxy (port 2026) + Next.js production server (combined container)
#   - gateway:       FastAPI Gateway API + agent runtime (dev mode, hot-reload, port 8001)
#   - provisioner:   (optional) Sandbox provisioner for Kubernetes mode
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
      - SKILLS_HOST_PATH=${DEER_FLOW_ROOT}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy + Next.js Production Server ─────────────────────────
  # Runs nginx (port 2026) and serves pre-built frontend dist via Next.js.
  # Build frontend dist first: make docker-build-frontend-dist
  nginx:
    build:
      context: ./nginx-frontend
      dockerfile: Dockerfile
    container_name: deer-flow-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - frontend-dist:/app/frontend:ro
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    depends_on:
      - gateway
    networks:
      - deer-flow-dev-backend
    restart: unless-stopped

  # ── Frontend Dist: One-shot init container ─────────────────────────────
  # Extracts the pre-built frontend dist to a shared volume for nginx+node to use.
  # Not started automatically; run manually or via make docker-start-backend-dev.
  frontend-dist:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend-dist
    command: >
      sh -c "
        echo 'Extracting frontend dist to shared volume...' &&
        mkdir -p /output &&
        cp -r /app/frontend/.next /output/ &&
        cp -r /app/frontend/node_modules /output/ &&
        cp -r /app/frontend/public /output/ 2>/dev/null; true &&
        cp -r /app/frontend/src /output/src 2>/dev/null; true &&
        cp /app/frontend/package.json /output/ &&
        cp /app/frontend/next.config.js /output/ 2>/dev/null; true &&
        echo 'Frontend dist extracted successfully'
      "
    volumes:
      - frontend-dist:/output
    # This service only runs as a one-shot init container (docker compose run --rm)
    restart: "no"

  # ── Backend: Gateway API (dev mode, hot-reload) ────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-postgres redis}
    container_name: deer-flow-gateway
    command: sh -c "{ cd backend && opts=''; for e in $$UV_EXTRAS; do opts=\"$$opts --extra $$e\"; done; (uv sync $$opts || (echo '[startup] uv sync failed; recreating .venv and retrying once' && uv venv --allow-existing .venv && uv sync $$opts)) && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml .env'; } > /app/logs/gateway.log 2>&1"
    volumes:
      - ../backend/:/app/backend/
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../agents:/app/agents:ro
      - ../skills:/app/skills
      - ../logs:/app/logs
      - gateway-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - UV_EXTRAS=${UV_EXTRAS:-}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev-backend
    restart: unless-stopped

volumes:
  gateway-venv:
  gateway-uv-cache:
  frontend-dist:

networks:
  deer-flow-dev-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.201.0/24
