# Optional KurrentDB overlay for examples/deerflow-extension-kurrentdb.
#
# Single-node insecure dev mode: no TLS, no authentication, no ACLs. The port
# is published on 127.0.0.1 only. Evaluation use only.
#
# With the Docker stack (the gateway reaches the service name):
#   docker compose -f docker/docker-compose.yaml \
#     -f docker/docker-compose.kurrentdb.yaml up -d
#   KURRENTDB_CONNECTION_STRING=kurrentdb://kurrentdb:2113?tls=false
#
# On its own, next to `make dev` (the gateway runs on the host):
#   docker compose -f docker/docker-compose.kurrentdb.yaml up -d
#   KURRENTDB_CONNECTION_STRING=kurrentdb://localhost:2113?tls=false
#
# Admin UI: http://localhost:2113. Projections are enabled for the demos in the
# extension README. Behind an HTTP proxy, add kurrentdb to NO_PROXY: gRPC
# honours the proxy variables. On arm64 hosts, set KURRENTDB_IMAGE to an arm64
# build of KurrentDB.

services:
  kurrentdb:
    image: ${KURRENTDB_IMAGE:-docker.kurrent.io/kurrent-latest/kurrentdb:latest}
    container_name: deer-flow-kurrentdb
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_INSECURE=true
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
    ports:
      - "127.0.0.1:${KURRENTDB_PORT:-2113}:2113"
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb
    networks:
      - deer-flow
    restart: unless-stopped

volumes:
  kurrentdb-data:
  kurrentdb-logs:

networks:
  deer-flow:
    driver: bridge
