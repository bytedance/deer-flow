[project]
name = "zens"
version = "0.1.0"
description = "Custom DeerFlow extensions"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "duckdb>=1.4.4",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "pyecharts>=2.1.0",
    "openpyxl>=3.1.0",
    "psycopg>=3.2.0",
    "asyncpg>=0.29.0",
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-docx>=1.1.0",
    "claude-agent-sdk>=0.2.87"
]

[tool.uv.sources]
deerflow-harness = { workspace = true }

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["zens*"]
exclude = ["logs*", "tests*"]
