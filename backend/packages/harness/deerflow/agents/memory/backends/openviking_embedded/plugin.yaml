# OpenViking memory backend -- external dependency declaration.
#
# The memory factory reads this at backend-selection time (not scan time) and
# ensures `dependencies` are importable. With `memory.allow_lazy_installs: true`
# it auto-installs them via `uv pip install --target <runtime_home>/memory_deps/openviking/`
# (outside the venv, so `uv sync` never wipes it). With `allow_lazy_installs: false`
# (default) it raises a clear error with the install command.
#
# New backend = copy this file, change the deps. No pyproject edit, no core code.
name: openviking
description: "OpenViking embedded memory backend (session pipeline + extraction)."

# pip specs (PEP 508, may pin versions) -- what to download.
dependencies:
  - openviking

# Module names used to detect whether the deps are already importable.
# Defaults to `dependencies` with version specifiers stripped if omitted.
import_names:
  - openviking
