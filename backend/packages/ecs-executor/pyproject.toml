[project]
name = "deerflow-ecs-executor"
version = "0.1.0"
description = "Native MCP local execution bridge with durable Docker jobs"
requires-python = ">=3.12"
dependencies = ["deerflow-harness>=0.2.5", "sqlalchemy>=2.0", "mcp>=1.20", "uvicorn>=0.30"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecs_executor"]
