[project]
name = "deer-flow"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.26",
    "sse-starlette>=3.3.4",
    "uvicorn[standard]>=0.46.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=22.7",
    "langgraph-sdk>=0.3.13",
    "markdown-to-mrkdwn>=0.3.1",
    "wecom-aibot-python-sdk>=1.0.2",
    "dingtalk-stream>=0.24.3",
    "bcrypt>=5.0.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.0.0",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
pdf = ["deerflow-harness[pdf]"]
postgres-pdf = ["deerflow-harness[postgres,pdf]"]

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "integration: integration tests that require external services (DB, embedding provider, etc.)",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
