name: Backend Benchmarks

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: backend-benchmarks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend development dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run informational benchmarks
        working-directory: backend
        run: make benchmark BENCHMARK_ARGS="--benchmark-json=benchmark-results.json"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-benchmark-results
          path: backend/benchmark-results.json
          if-no-files-found: warn
          retention-days: 30
