name: Sandbox Image Smoke

# Real-image validation of the Docker sandbox hardening: pulls the shipped
# AIO image and drives it through the production readiness deadline
# (SANDBOX_LOCAL_PROVIDER_READY_TIMEOUT). The offline unit suite (-m "not
# live") never runs this, so this dedicated job is the only place the
# known-bad capability/startup regressions are caught before merge.
#
# Reproducibility: the image reference comes from the repository variable
# SANDBOX_SMOKE_IMAGE (pin a digest there, e.g.
# registry/.../all-in-one-sandbox@sha256:...). When unset it falls back to
# the mutable :latest tag and the resolved digest is printed to the job
# summary so a failure can be reproduced against the exact image tested.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/packages/harness/deerflow/community/aio_sandbox/**'
      - 'backend/tests/test_aio_sandbox_local_backend.py'
      - '.github/workflows/sandbox-image-smoke.yml'

concurrency:
  group: sandbox-image-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEER_FLOW_SANDBOX_SMOKE_IMAGE: ${{ vars.SANDBOX_SMOKE_IMAGE || 'enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and record the tested image digest
        run: |
          set -euo pipefail
          digest="$(docker manifest inspect "$DEER_FLOW_SANDBOX_SMOKE_IMAGE" | jq -r '.manifests[0].digest // .config.digest')"
          echo "Smoke-testing $DEER_FLOW_SANDBOX_SMOKE_IMAGE (digest $digest)" >> "$GITHUB_STEP_SUMMARY"
          echo "Sandbox smoke image: $DEER_FLOW_SANDBOX_SMOKE_IMAGE ($digest)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run the live real-image smoke test
        working-directory: backend
        run: uv run pytest -m live tests/test_aio_sandbox_local_backend.py -v
