config_version: 11
log_level: info
token_usage:
  enabled: true
ui:
  show_bash_script: false
database:
  # 切换后端：只需改 backend 字段，db_name 保持不变
  # - sqlite: 本地开发，数据存在 {sqlite_dir}/{db_name}.db
  # - postgres: 生产部署，数据存在 postgres_url 指向的数据库
  backend: postgres
  db_name: ehm_ai

  # SQLite 配置（backend: sqlite 时生效）
  sqlite_dir: .deer-flow/data

  # PostgreSQL 配置（backend: postgres 时生效）
  postgres_url: $POSTGRES_URL
  pool_size: 5
  max_overflow: 5
auth:
  enabled: true
  rsa_public_key: $RSA_PUBLIC
  jwt_secret: change-me-in-production-use-env-var
  jwt_algorithm: HS256
  jwt_expire_minutes: 1440
  api_key_enabled: true
  admin_username: admin
  admin_password_hash: ''
models:
- name: deepseek-v4-pro
  display_name: InS-4.0 Pro
  use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
  model: deepseek-v4-pro
  api_key: $OPENAI_API_KEY
  api_base: https://aiapi.shenguyun.com/v1
  timeout: 600.0
  max_retries: 2
  max_tokens: 8192
  supports_thinking: true
  supports_vision: true
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled

# Qwen3 推理模型 - 支持 thinking 开关
- name: qwen3-32b
  display_name: Qwen3-32B
  use: langchain_openai:ChatOpenAI
  model: qwen3-32b
  api_key: $OPENAI_API_KEY
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 4096
  temperature: 0.7
  supports_vision: true
  base_url: https://aiapi.shenguyun.com/v1


tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
- name: industrial:asset
tools:
- name: web_search
  group: web
  use: deerflow.community.ddg_search.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool
- name: resolve_component_context
  group: industrial:asset
  use: deerflow.tools.industrial_asset_tools:resolve_component_context
- name: resolve_machine_context
  group: industrial:asset
  use: deerflow.tools.industrial_asset_tools:resolve_machine_context
tool_search:
  enabled: false
uploads:
  pdf_converter: auto
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  image: deer-flow-sandbox:latest
  environment:
    INS_BASE_URL: $INS_BASE_URL
    INS_CONNECT_TIMEOUT: $INS_CONNECT_TIMEOUT
    INS_READ_TIMEOUT: $INS_READ_TIMEOUT
    INS_WRITE_TIMEOUT: $INS_WRITE_TIMEOUT
    INS_POOL_TIMEOUT: $INS_POOL_TIMEOUT
    FEATURES_TOOL_ROOT: /mnt/skills/custom/features-tool
    # 设备日/周/月报数据源开关（未设置 = demo）；切真数据时取消下一行注释
    DEER_FLOW_DATA_PROVIDER: ins
    # Gateway API URL for scripts running inside sandbox containers
    DEER_FLOW_GATEWAY_URL: http://host.docker.internal:8001
    # Internal auth token so sandbox scripts can call Gateway APIs
    DEER_FLOW_INTERNAL_AUTH_VALUE: $DEER_FLOW_INTERNAL_AUTH_VALUE
    # 销售易 CRM 凭证（供 crm-analyst Skill 脚本使用）
    XSY_CLIENT_ID: $XSY_CLIENT_ID
    XSY_CLIENT_SECRET: $XSY_CLIENT_SECRET
    XSY_USERNAME: $XSY_USERNAME
    XSY_PASSWORD: $XSY_PASSWORD
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  allow_host_bash: false
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
session_memory:
  enabled: false
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
cost:
  enabled: true
  storage_backend: json
  model_pricing:
  - model: gpt-5.4
    input_per_1k_tokens: 0.003
    output_per_1k_tokens: 0.015
  - model: gpt-5.2
    input_per_1k_tokens: 0.003
    output_per_1k_tokens: 0.015
  - model: deepseek-v4-pro
    input_per_1k_tokens: 0.003
    output_per_1k_tokens: 0.015
  budget:
    default_daily_limit_usd: 50.0
    default_monthly_limit_usd: 1000.0
    alert_threshold_pct: 0.8
    action_on_exceed: block
content_safety:
  enabled: true
  input_guard:
    enabled: true
    block_on_harmful: true
    categories:
    - hate
    - sexual
    - violence
    - self-harm
    - illegal
    prompt_injection_detection: true
  output_guard:
    enabled: true
    pii_detection: true
    pii_action: mask
    block_on_harmful: false
  provider:
    use: deerflow.content_safety.builtin:RegexPIIProvider
    config:
      action: mask
      detect_credit_cards: false
      detect_phones: false
      detect_emails: true
      detect_chinese_ids: true
rag:
  enabled: true
  embedding_model: openai:text-embedding-v4
  embedding_api_key: $OPENAI_API_KEY
  embedding_base_url: https://aiapi.shenguyun.com/v1
  embedding_batch_size: 10
   # vector_store_backend: chroma   # 本地 SQLite（开发/单机）
  vector_store_backend: pgvector
  chunk_size: 1000
  chunk_overlap: 200
  chunk_strategy: recursive
  retrieval_top_k: 5
  score_threshold: 0.0
  reranker_enabled: false
  injection_enabled: true
  tool_enabled: true
  max_injection_chunks: 3
  max_injection_tokens: 2000
run_events:
  backend: db
  max_trace_content: 10240
  track_token_usage: true
audio_input:
  enabled: true
  microphone_enabled: true
  file_transcription_enabled: true
  default_locale: zh-CN
  supported_locales:
    - zh-CN
    - en-US
  accepted_mime_types:
    - audio/mpeg
    - audio/mp3
    - audio/wav
    - audio/x-wav
    - audio/wave
    - audio/webm
    - audio/ogg
    - audio/mp4
    - audio/x-m4a
    - audio/aac
    - audio/flac
  max_file_size: 26214400
  provider:
    use: deerflow.audio.providers.qwen_asr:QwenASRTranscriptionProvider
    config:
      model: qwen3-asr-flash
      api_key: $DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      timeout_s: 120.0
http_connectors:
  default:
    - name: list_datasets
      description: "列举可用数据集"
      url: "http://data-platform.internal/api/v1/datasets"
      method: GET
      auth_type: bearer
      auth_token_env: DATA_PLATFORM_TOKEN
      timeout_seconds: 30
      max_response_bytes: 524288
      cache_ttl_seconds: 300
      max_retries: 1
stream_bridge:
  type: memory
  redis_url: $REDIS_URL
  queue_maxsize: 1024
rate_limit:
  enabled: false
  backend: memory
  redis_url: ''
  global_per_minute: 1000
  tenant_per_minute: 100
  user_per_minute: 60
  llm_calls_per_minute: 50
  tokens_per_minute: 100000

# ============================================================================
# Nacos Service Discovery (set to null or omit to disable)
# ============================================================================
nacos:
  server_addr: "182.92.187.198:8848"
  namespace: "385e3ff9-08b9-4f24-b7df-a9c6a323a9ff"
  username: "nacos"          # Nacos 登录用户名（可选，不配置则不认证）
  password: "$NACOS_PASSWORD"  # Nacos 登录密码（可选，支持 $ENV_VAR 语法）
  service:
    name: "deer-flow-gateway"
    port: $GATEWAY_PORT

# ============================================================================
# Java RPC Client (set to null or omit to disable)
# ============================================================================
rpc:
  default_timeout: 30.0
  services:
    - name: ins-bus-rpc
      #discovery: ins-bus-rpc     # Nacos 服务发现名称（与 base_url 二选一）
      base_url: "http://182.92.187.198:8801"  # 直连模式（与 discovery 二选一）
    - name: ins-base-rpc
#      discovery: ins-base-rpc    # Nacos 服务发现名称（与 base_url 二选一）
      base_url: "http://182.92.187.198:8601"  # 直连模式（与 discovery 二选一）

# ============================================================================
# 外部系统集成 (CRM/ERP/InS/SMS)
# ============================================================================
integrations:
  enabled: true
  systems:
    ins_prod:
      system_type: ins
      display_name: "InS Production"
      connector_ref: ins_http_main  # Reference to existing tenant connector
      transport_type: http
      base_url: "http://182.92.187.198/"
      base_path: "/"
      auth_type: bearer
      auth_mode: user_token        # "static" uses secret_ref; "user_token" forwards current user's access_token
      #secret_ref: "$INS_TOKEN"
      timeout_seconds: 30
      max_retries: 2
      capabilities:
        - asset.catalog
        - asset.context
        - monitoring.trend
        - monitoring.waveform
        - monitoring.orbit
        - monitoring.alarm_history
    xsy_prod:
      system_type: xsy
      display_name: "销售易 CRM"
      description: "销售易 CRM 系统集成，提供产品出库、服务事件查询与统计"
      transport_type: http
      base_url: "https://api.xiaoshouyi.com"
      auth_type: xsy_oauth2
      auth_mode: static
      timeout_seconds: 30.0
      enabled: true
      capabilities:
        - outbound.query
        - outbound.statistics
        - service_event.query
        - service_event.statistics
        - service_event.anomaly
        - xsy.report
      extra_config:
        auth_url: "https://login.xiaoshouyi.com/auc/oauth2/token"
        client_id_env: "$XSY_CLIENT_ID"
        client_secret_env: "$XSY_CLIENT_SECRET"
        username_env: "$XSY_USERNAME"
        password_env: "$XSY_PASSWORD"
    sms:
      system_type: sms
      display_name: "SMS设备异常统计与评估系统"
      description: "SMS集成，提供异常列表/详情、健康评估、风险排名、待办统计"
      transport_type: http
      base_url: "http://182.92.187.198"
      auth_type: bearer
      auth_mode: user_token
      timeout_seconds: 30.0
      enabled: true
      capabilities:
        - abnormal.list
        - abnormal.detail
        - health.assessment
        - health.anomaly_statistics
        - health.risk_ranking
        - todo_stats.get
  routes:
    monitoring.trend: ins_prod
    monitoring.alarm_history: ins_prod
    outbound.query:
      primary_system_key: xsy_prod
    outbound.statistics:
      primary_system_key: xsy_prod
    service_event.query:
      primary_system_key: xsy_prod
    service_event.statistics:
      primary_system_key: xsy_prod
    service_event.anomaly:
      primary_system_key: xsy_prod
    xsy.report:
      primary_system_key: xsy_prod
    todo_stats.get:
      primary_system_key: sms
    abnormal.list:
      primary_system_key: sms
    abnormal.detail:
      primary_system_key: sms
    health.assessment:
      primary_system_key: sms
    health.anomaly_statistics:
      primary_system_key: sms
    health.risk_ranking:
      primary_system_key: sms
