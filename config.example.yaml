# ============================================================================
# Guardrails 配置
# ============================================================================
# 可选的工具调用执行前授权。
# 启用后，每次工具调用都会先经过配置的 provider，再决定是否执行。
# 三种选项：内置白名单、OAP 策略 provider、或自定义 provider。
# 完整文档参见 backend/docs/GUARDRAILS.md。
#
# Provider 通过 resolve_variable 按类路径加载（与 models/tools 相同）。

# --- 选项 1：内置 AllowlistProvider（零外部依赖） ---
# guardrails:
#   enabled: true
#   provider:
#     use: deerflow.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- 选项 2：OAP passport provider（开放标准，任意实现） ---
#   Open Agent Passport (OAP) 规范定义了 passport 格式和决策码。
#   任何遵循 OAP 的 provider 都可使用。下例使用 APort（参考实现）：
#     pip install aport-agent-guardrails && aport setup --framework deerflow
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- 选项 3：自定义 provider（任何具有 evaluate/aevaluate 方法的类） ---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# ============================================================================
# 熔断器（Circuit Breaker）配置
# ============================================================================
# 针对 LLM 调用的熔断器，可防止反复请求已经发生故障的 provider。
# 当达到失败阈值后，后续调用会快速失败直到恢复。
#
# 适用场景：
# - 在 provider 故障期间避免触发限流封禁
# - 减少重试循环造成的资源耗尽
# - 当 LLM 服务不可用时优雅降级

# circuit_breaker:
#   # 在开启熔断之前的连续失败次数（默认：5）
#   failure_threshold: 5
#   # 在尝试恢复之前的等待时间（秒，默认：60）
#   recovery_timeout_sec: 60

# ============================================================================
# SSO / OIDC 认证（可选）
# ============================================================================
# 通过任何兼容 OIDC 的 provider（Keycloak、Google、Azure AD、Okta 等）启用 SSO 登录。
# 启用后，登录页将在标准邮箱/密码表单旁边显示 SSO 按钮。
#
# Provider 配置：
#   - issuer:      OIDC issuer URL（例如 https://keycloak.example.com/realms/deerflow）
#   - client_id:   来自 provider 的 OAuth2 client ID
#   - client_secret: OAuth2 client secret（支持 $ENV_VAR 引用）
#   - redirect_uri: 回调 URL。在生产环境中必须与你在 provider 中配置的一致。
#                   开发环境下默认自动推导。
#
# Keycloak 设置：
#   1. 创建一个类型为 "confidential" 的 client 并启用 Standard Flow
#   2. 添加 Valid Redirect URI：http://localhost:8001/api/v1/auth/callback/keycloak
#   3. 添加 Web Origin：http://localhost:8001（或你的前端来源）

# auth:
#   oidc:
#     enabled: true
#     # 前端的 base URL，用于 SSO 回调后的跳转。
#     # 在反向代理后的生产环境中，将其设为公开前端 URL
#     #（例如 https://deerflow.example.com）。开发环境下可以不设置。
#     # frontend_base_url: http://localhost:3000
#     providers:
#       keycloak:
#         display_name: Keycloak
#         issuer: https://keycloak.example.com/realms/deerflow
#         client_id: deerflow
#         client_secret: $KEYCLOAK_CLIENT_SECRET
#         # 可选：显式设置回调 URL。
#         # redirect_uri: https://deerflow.example.com/api/v1/auth/callback/keycloak
#         scopes:
#           - openid
#           - email
#           - profile
#         token_endpoint_auth_method: client_secret_post
#
#         # 用户开通设置（下方为安全默认值）：
#         auto_create_users: true          # 首次 SSO 登录时自动创建 DeerFlow 账号
#         require_verified_email: true     # 拒绝邮箱未验证的 SSO 登录
#         # allowed_email_domains:          # 限制为特定邮箱域名
#         #   - example.com
#         admin_emails: []                 # 自动为这些邮箱授予 admin 角色
#
#         # 安全特性（默认启用）：
#         pkce_enabled: true               # 授权码流程的 PKCE（S256）
#         nonce_enabled: true              # ID token 的 nonce 校验
