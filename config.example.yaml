# DeerFlow 应用配置
#
# 使用指南：
# - 将此文件复制为 `config.yaml` 并按你的环境进行自定义
# - 该配置文件默认路径为项目根目录下的 `config.yaml`。
#   你可以设置 `DEER_FLOW_PROJECT_ROOT` 显式定义该根目录，或使用
#   `DEER_FLOW_CONFIG_PATH` 指向具体的配置文件。
# - 运行时状态默认位于项目根目录下的 `.deer-flow`。需要不同的可写数据目录时，
#   可使用 `DEER_FLOW_HOME` 覆盖。
# - 所有字段值均支持环境变量，例如：`api_key: $OPENAI_API_KEY`
# - `use` 路径是一个字符串，格式形如 "package_name.sub_package_name.module_name:class_name/variable_name"。

# ============================================================================
# 配置版本（用于检测过时的配置文件）
# ============================================================================
# 当配置 schema 发生变更时递增该数字。
# 运行 `make config-upgrade` 可将新字段合并到你本地的 config.yaml 中。
config_version: 15

# ============================================================================
# 日志
# ============================================================================
# deerflow 模块的日志级别（debug/info/warning/error）
log_level: info

# ============================================================================
# Token 用量
# ============================================================================
# 启用 token 使用量采集与展示。
# 启用后，DeerFlow 会按模型调用记录输入/输出/总 token 数，
# 并在 provider 返回使用元数据时在工作区 UI 中展示。
token_usage:
  enabled: true

# ============================================================================
# Token 预算 —— 每次运行的 token 上限
# ============================================================================
# 通过强制每次运行的 token 硬上限来防止 API 费用失控。
# 当跨越 warn_threshold 时，agent 会收到上下文内的警告。
# 当跨越 hard_stop_threshold 时，将剥离 tool_calls 并强制 agent
# 立即给出最终答案。
token_budget:
  enabled: false                # 设置为 true 以启用预算强制
  max_tokens: 200000            # 每次运行的总 token 上限（输入 + 输出）
  max_input_tokens: null        # 可选的单独输入 token 上限
  max_output_tokens: null       # 可选的单独输出 token 上限
  warn_threshold: 0.8           # 在预算 80% 时发出警告
  hard_stop_threshold: 1.0      # 在预算 100% 时强制停止


# ============================================================================
# 模型配置
# ============================================================================
# 配置 agent 可使用的 LLM 模型

models:
  # 示例：360 智脑（OpenAI 兼容 chat/completions）
  # 取消下方注释即可启用；将 API key 放到项目根目录 .env 中作为 QIHOO_360_API_KEY。
  # 文档：https://ai.360.com/docs
  # - name: qwen3.5-35b
  #   display_name: 360 智脑 Qwen3.5-35B-A3B
  #   use: deerflow.models.patched_360:PatchedChat360
  #   model: qwen/qwen3.5-35b-a3b
  #   base_url: https://api.360.cn/v1
  #   api_key: $QIHOO_360_API_KEY
  #   request_timeout: 600.0      # 单次请求超时（秒），长上下文 / thinking 模型建议设大一些
  #   max_retries: 2              # 网络错误自动重试次数
  #   max_tokens: 8192            # 单次回复最大 token 数（不要超过模型上下文窗口）
  #   temperature: 0.7            # 0~2，越大越发散；事实/代码任务建议 0~0.3
  #   disable_streaming: tool_calling  # 360 当前工具调用建议禁用工具场景下的流式，避免 tool_call 退化成正文文本
  #   # top_p: 0.9                # 可选，与 temperature 二选一调
  #   # presence_penalty: 0       # 可选，-2~2
  #   # frequency_penalty: 0      # 可选，-2~2
  #   # 注意：qwen/qwen3.5-35b-a3b 当前不支持 Responses API，
  #   # 不要为这条模型配置 use_responses_api / output_version。
  #   supports_thinking: true     # 模型支持扩展 thinking 时设为 true，UI 的 thinking 开关才会生效
  #   supports_vision: true       # 支持图片输入则设为 true，会启用 view_image 工具
  #   # supports_reasoning_effort: false  # 仅当模型支持 reasoning_effort 参数（如 GPT-5、StepFun）时启用
  #   # 可选：在 thinking 开关 ON/OFF 时分别传给后端的额外参数
  #   # when_thinking_enabled:
  #   #   extra_body:
  #   #     thinking:
  #   #       type: enabled
  #   # when_thinking_disabled:
  #   #   extra_body:
  #   #     thinking:
  #   #       type: disabled

  # 示例：火山引擎（豆包）模型
  # - name: doubao-seed-1.8
  #   display_name: Doubao-Seed-1.8
