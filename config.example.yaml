  #   temperature: 1.0  # MiniMax 要求 temperature 取值为 (0.0, 1.0]
  #   supports_vision: true
  #   supports_thinking: true
  #   # PatchedChatMiniMax 是 MiniMax 适配器：它启用 reasoning_split 并
  #   # 将 MiniMax 的结构化推理映射到 reasoning_content（DeerFlow 理解的字段），
  #   # 同时会移除 DeerFlow 中间件附加的每条消息上的 `name` 字段——MiniMax 会
  #   # 因为 user 消息名称不一致而拒绝请求，错误为 "user name must be consistent (2013)"。
