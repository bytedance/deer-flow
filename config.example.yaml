  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434   # 不要带 /v1 后缀——会使用原生 /api/chat
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true                    # 向 Ollama 原生 API 传递 think:true
  #   supports_thinking: true
  #   supports_vision: false
  #
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   supports_thinking: true
  #   supports_vision: true
  #
  # 对于 Docker 部署，请使用 host.docker.internal 代替 localhost：
  #   base_url: http://host.docker.internal:11434

  # 示例：Anthropic Claude 模型（含扩展 thinking）
  # 必须设置 supports_thinking: true——否则即便 UI 上的 thinking 开关已打开，
  # DeerFlow 也会静默回退到非 thinking 模式。
  # 当 thinking.type=enabled 时，Anthropic API 要求设置 budget_tokens
  #（服务端无默认值；最小 1024；必须小于 max_tokens）。
