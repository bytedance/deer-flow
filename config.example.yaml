  # 示例：Ollama（原生 provider —— 保留 thinking/reasoning 内容）
  #
  # 重要：对于 Ollama 模型，请使用 langchain_ollama:ChatOllama 而不是
  # langchain_openai:ChatOpenAI。OpenAI 兼容端点（/v1/chat/completions）
  # 不会将 reasoning_content 作为单独字段返回——thinking 内容要么被压平
  # 进 <think> 标签，要么被完全丢弃（ollama/ollama#15293）。
  # 原生 Ollama API（/api/chat）能正确地将 thinking 与回复内容分离。
  #
  # 安装：cd backend && uv pip install 'deerflow-harness[ollama]'
