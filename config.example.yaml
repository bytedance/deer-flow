  # 示例：OpenRouter（OpenAI 兼容）
  # OpenRouter 模型使用与其他 OpenAI 兼容网关相同的 ChatOpenAI + base_url 模式。
  # - name: openrouter-gemini-2.5-flash
  #   display_name: Gemini 2.5 Flash (OpenRouter)
  #   use: langchain_openai:ChatOpenAI
  #   model: google/gemini-2.5-flash-preview
  #   api_key: $OPENAI_API_KEY
  #   base_url: https://openrouter.ai/api/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   temperature: 0.7

  # 示例：vLLM 0.19.0（OpenAI 兼容，支持 reasoning 开关）
  # DeerFlow 的 vLLM provider 在多轮 tool-call 中保留 vLLM 推理内容，
  # 并通过写入 extra_body.chat_template_kwargs.enable_thinking=true/false
  # 来切换 Qwen 风格的 reasoning。
  # 部分 reasoning 模型还要求服务端以
  # `vllm serve ... --reasoning-parser <parser>` 启动。
  # - name: qwen3-32b-vllm
  #   display_name: Qwen3 32B (vLLM)
  #   use: deerflow.models.vllm_provider:VllmChatModel
  #   model: Qwen/Qwen3-32B
  #   api_key: $VLLM_API_KEY
  #   base_url: http://localhost:8000/v1
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 8192
  #   supports_thinking: true
  #   supports_vision: false
  #   when_thinking_enabled:
  #     extra_body:
  #       chat_template_kwargs:
  #         enable_thinking: true


  # 示例：部署在 MindIE Engine 上的 Qwen3-Coder
  # - name: Qwen3_Coder_480B_MindIE
  #   display_name: Qwen3-Coder-480B (MindIE)
  #   use: deerflow.models.mindie_provider:MindIEChatModel
  #   model: Qwen3-Coder-480B-A35B-Instruct-Client
  #   base_url: http://localhost:8989/v1
  #   api_key: $OPENAI_API_KEY
  #   temperature: 0
  #   max_retries: 1
  #   supports_thinking: false
  #   supports_vision: false
  #   supports_reasoning_effort: false
  #   # --- 高级网络设置 ---
  #   # 由于 MindIE 在工具调用方面存在流式限制，provider
  #   # 使用模拟流式（等待完整生成）。需要更长的超时时间。
  #   read_timeout: 900.0     # 15 分钟，避免在长文档生成期间断开
  #   connect_timeout: 30.0
  #   write_timeout: 60.0
  #   pool_timeout: 30.0

# ============================================================================
# 工具分组配置
# ============================================================================
# 定义工具分组，便于组织和访问控制

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# 工具配置
# ============================================================================
# 配置 agent 可使用的工具

tools:
  # 网页搜索工具（使用 DuckDuckGo，无需 API key）
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
    # backend: auto          # DDGS 后端：auto、duckduckgo、brave、wikipedia 等。
    # region: wt-wt          # 当 backend 包含 auto/all/wikipedia 时，wt-wt 会被规范化为适用于 Wikipedia。
    # safesearch: moderate   # on、moderate、off

  # 网页搜索工具（使用 SearXNG，自托管，无需 API key）
  # SearXNG 是一个免费的互联网元搜索引擎，聚合来自多个搜索服务的结果。
  # 自部署实例：https://github.com/searxng/searxng
  # Docker 部署时，请使用 Docker 服务名称而非 localhost。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.searxng.tools:web_search_tool
  #   base_url: http://localhost:8088   # SearXNG 实例 URL（默认 :8088；Docker：http://searxng:8080）
  #   max_results: 5                     # 最大搜索结果数

  # 网页搜索工具（使用 Serper - Google 搜索 API，需要 SERPER_API_KEY）
  # Serper 提供实时 Google 搜索结果。在 https://serper.dev 注册。
  # 注意：在启动应用前请在环境中设置 SERPER_API_KEY。
  # 避免将 API key 字面量写入 config.yaml；请使用 $VAR 形式。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.serper.tools:web_search_tool
  #   max_results: 5   # Serper provider 上限为 10
  #   # api_key: $SERPER_API_KEY  # 可选的显式环境变量引用

  # 网页搜索工具（使用 Brave Search API，需要 BRAVE_SEARCH_API_KEY）
  # Brave Search 返回来自独立索引的结果。在
  # https://brave.com/search/api/ 注册以获取 key。与上面的 DuckDuckGo
  # `backend: brave` 选项不同，此项直接调用官方 Brave API。
  # - name: web_search
  #   group: web
  #   use: deerflow.community.brave.tools:web_search_tool
  #   max_results: 5                  # Brave Search API 上限为 20
  #   # api_key: $BRAVE_SEARCH_API_KEY  # 如果设置了环境变量则可选

  # 网页搜索工具（需要 Tavily API key）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $TAVILY_API_KEY  # 按需设置

  # 网页搜索工具（使用 InfoQuest，需要 InfoQuest API key）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   # 用于限制搜索结果范围，仅返回指定时间范围内的内容。设置为 -1 可禁用时间过滤
  #   search_time_range: 10

  # 网页搜索工具（使用 Exa，需要 EXA_API_KEY）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.exa.tools:web_search_tool
  #   max_results: 5
  #   search_type: auto  # 可选：auto、neural、keyword
  #   contents_max_characters: 1000
  #   # api_key: $EXA_API_KEY

  # 网页搜索工具（使用 Firecrawl，需要 FIRECRAWL_API_KEY）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $FIRECRAWL_API_KEY

  # 网页搜索工具（使用 GroundRoute，需要 GROUNDROUTE_API_KEY）
  # GroundRoute 是元搜索层：一个 API 前置于六个引擎（Serper、Brave、Exa、
  # Tavily、Firecrawl、Perplexity）。它会将每个查询路由到能通过质量门槛
  # 的最便宜引擎，并在某个引擎故障时自动切换。计费方式为收益分成
  #（你可以保留缓存节省的大约一半费用）。在
  # https://groundroute.ai/keys 获取 key
  # - name: web_search
  #   group: web
  #   use: deerflow.community.groundroute.tools:web_search_tool
  #   max_results: 5                  # GroundRoute 限制在 1-50
  #   # api_key: $GROUNDROUTE_API_KEY  # 如果设置了环境变量则可选

  # 网页搜索工具（使用 fastCRW - 兼容 Firecrawl 的网页抓取工具，单一二进制，
  # 自托管或云端。云端需要 CRW_API_KEY；自托管可能无需 key。）
  # - name: web_search
  #   group: web
  #   use: deerflow.community.fastcrw.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $CRW_API_KEY
  #   # base_url: https://fastcrw.com/api   # 默认云端；自托管可设为例如 http://localhost:3000

  # 网页抓取工具（使用 Browserless - 无头 Chrome，自托管或云端）
  # Browserless 使用真实的无头 Chrome 渲染页面，非常适合 JavaScript 密集型
  # 网站和 SPA。自部署：https://github.com/browserless/browserless
  # Docker 部署时，请使用 Docker 服务名称而非 localhost。
  # 注意：同时只能启用一个 web_fetch provider。
  # 启用此项前请注释下方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.browserless.tools:web_fetch_tool
  #   base_url: http://localhost:3032    # Browserless 实例 URL（默认 :3032；Docker：http://browserless:3000）
  #   # token: $BROWSERLESS_TOKEN        # API 令牌（Browserless 云端必需；自托管可选）
  #   timeout_s: 30                       # 请求超时（秒）
  #   # wait_for_event: "networkidle"    # 在返回前等待某个页面事件（例如 "load"、"networkidle"）
  #   # wait_for_timeout_ms: 2000        # 页面加载后额外等待的毫秒数
  #   # wait_for_selector: "article"     # 在返回前等待匹配的 CSS 选择器

  # 网页抓取工具（使用 Exa）
  # 注意：同时只能启用一个 web_fetch provider。
  # 启用此项前请注释下方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.exa.tools:web_fetch_tool
  #   # api_key: $EXA_API_KEY

  # 网页抓取工具（使用 Jina AI reader）
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
    # 适用于受限网络 / Docker / WSL 的可选代理。
    # 当代理运行在宿主机上时，请使用 host.docker.internal 而非 127.0.0.1。
    # proxy: $HTTPS_PROXY
    # trust_env: true

  # 网页抓取工具（使用 InfoQuest）
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   # 整个抓取过程的总超时时间（秒）。设置为正值以启用，-1 表示禁用
  #   timeout: 10
  #   # 页面加载后的等待时间（秒）。设置为正值以启用，-1 表示禁用
  #   fetch_time: 10
  #   # 导航到页面的超时时间（秒）。设置为正值以启用，-1 表示禁用
  #   navigation_timeout: 30

  # 网页抓取工具（使用 Firecrawl，需要 FIRECRAWL_API_KEY）
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool
  #   # api_key: $FIRECRAWL_API_KEY

  # 网页抓取工具（使用 GroundRoute，需要 GROUNDROUTE_API_KEY）
  # 通过 GroundRoute mode=page 获取页面抽取后的文本。
  # 注意：同时只能启用一个 web_fetch provider。
  # 启用此项前请注释上方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.groundroute.tools:web_fetch_tool
  #   # api_key: $GROUNDROUTE_API_KEY

  # 网页抓取工具（使用 fastCRW - 兼容 Firecrawl 的网页抓取工具，单一二进制，
  # 自托管或云端。云端需要 CRW_API_KEY；自托管可能无需 key。）
  # 注意：同时只能启用一个 web_fetch provider。
  # 启用此项前请注释上方的 Jina AI web_fetch 条目。
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.fastcrw.tools:web_fetch_tool
  #   # api_key: $CRW_API_KEY
  #   # base_url: https://fastcrw.com/api   # 默认云端；自托管可设为例如 http://localhost:3000

  # 图片搜索工具（使用 DuckDuckGo）
  # 用于在图片生成之前查找参考图
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

  # 图片搜索工具（使用 InfoQuest）
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   # 用于限制图片搜索结果范围，仅返回指定时间范围内的内容。设置为 -1 可禁用时间过滤
  #   image_search_time_range: 10
  #   # 图片尺寸过滤。可选："l"（大）、"m"（中）、"i"（图标）。
  #   image_size: "i"

  # 图片搜索工具（使用 Serper - Google 图片 API，需要 SERPER_API_KEY）
  # Serper 提供实时 Google 图片搜索结果。在 https://serper.dev 注册。
  # 注意：在启动应用前请在环境中设置 SERPER_API_KEY。
  # 避免将 API key 字面量写入 config.yaml；请使用 $VAR 形式。
  # - name: image_search
  #   group: web
  #   use: deerflow.community.serper.tools:image_search_tool
  #   max_results: 5   # Serper provider 上限为 10
  #   # api_key: $SERPER_API_KEY  # 可选的显式环境变量引用

  # 文件操作工具
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash 执行工具
  # 仅在使用隔离 shell 沙箱时，或当 sandbox.allow_host_bash: true
  # 显式启用宿主机 bash 时才会激活。
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ============================================================================
# 工具搜索配置（延迟工具加载）
# ============================================================================
# 启用后，MCP 工具不会直接加载到 agent 的上下文。
# 取而代之的是，它们会在系统提示中按名称列出，
# 并在运行时通过 tool_search 工具进行发现。
# 当多个 MCP 服务器暴露大量工具时，可减少上下文占用并
# 提升工具选择的准确性。

tool_search:
  enabled: false

# ============================================================================
# 工具输出预算保护
# ============================================================================
# 防止超大工具结果把模型上下文窗口撑爆。
# 输出超过 `externalize_min_chars` 会被持久化到磁盘，并替换为一个
# 紧凑的预览 + 文件引用。模型可通过 read_file 读取完整输出。
# 当磁盘持久化不可用时，超过 `fallback_max_chars` 的输出会改为
# 头尾截断。
#
# `exempt_tools` 用于防止读取工具陷入 persist→read→persist 无限循环。
# `tool_overrides` 允许按工具自定义阈值。

tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: ".tool-results"
  exempt_tools:
    - read_file
    - read_file_tool
  # tool_overrides:
  #   web_search: 8000
  #   bash: 20000

# ============================================================================
# 建议配置
# ============================================================================
# 配置 agent 是否在每次回复末尾自动生成
# 跟进问题建议。

suggestions:
  enabled: true


# ============================================================================
# 循环检测配置
# ============================================================================
# 检测并中断重复的相同工具调用循环。
# 频率阈值是同类型工具重复使用的安全限制。

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  # 对 tool_freq_warn / tool_freq_hard_limit 的按工具覆盖。值可以高于或
  # 低于全局默认值。常用于在批量工作流（例如 RNA-seq 流水线）中提高
  # bash 等高频工具的阈值，而不削弱对其他工具的保护。
  # tool_freq_overrides:
  #   bash:
  #     warn: 150
  #     hard_limit: 300

# ============================================================================
# Provider 安全终止配置
# ============================================================================
# 拦截 provider 因安全原因（例如 OpenAI finish_reason='content_filter'、
# Anthropic stop_reason='refusal'、Gemini finish_reason='SAFETY'）停止生成
# 但仍返回 tool_calls 的 AIMessage。这类响应中的 tool_calls 通常被截断
# 且不可靠，必须不能执行。完整失败模式参见 issue #3028。
#
# 检测器通过反射按类路径加载（与 guardrails / models / tools 同样的模式）。
# 内置集合涵盖 OpenAI 兼容的 content_filter、Anthropic refusal，以及
# Gemini SAFETY/BLOCKLIST/PROHIBITED_CONTENT/SPII/RECITATION。

safety_finish_reason:
  enabled: true
  # `detectors` 未设置时使用内置检测器集合。设置为非空列表则完全覆盖
  #（如需禁用请使用 `enabled: false`，而不是提供空列表）。
  #
  # 示例 —— 为某个使用非标准 finish_reason 词元的中文 provider 扩展
  # OpenAI 兼容检测器：
  # detectors:
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:OpenAICompatibleContentFilterDetector
  #     config:
  #       finish_reasons: ["content_filter", "sensitive", "risk_control"]
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:AnthropicRefusalDetector
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:GeminiSafetyDetector
  #
  # 示例 —— 为内部 provider 添加自定义检测器：
  # detectors:
  #   - use: my_company.deerflow_ext:WenxinSafetyDetector
  #     config:
  #       error_codes: [336003, 17, 18]

# ============================================================================
# 沙箱配置
# ============================================================================
# 在本地沙箱（直接执行）和基于 Docker 的 AIO 沙箱之间选择

# 选项 1：本地沙箱（默认）
# 在宿主机上直接执行命令
uploads:
  # 应用层级的上传限制，由 gateway 强制执行并在文件选择前向前端暴露。
  max_files: 10
  max_file_size: 52428800    # 50 MiB
  max_total_size: 104857600  # 100 MiB
  # 在沙箱隔离生效之前，自动 Office/PDF 转换会在后端宿主机上运行。
  # 除非上传来源完全可信且你有意接受宿主机侧解析器风险，否则请保持禁用。
  auto_convert_documents: false
  # 控制每次 PDF 转换运行时所使用的 PDF→Markdown 转换器。
  # 自动上传转换由 auto_convert_documents 单独控制。
  # auto        —— 已安装 pymupdf4llm 时优先使用；对于基于图片或加密的 PDF
  #               回退到 MarkItDown（推荐默认）。
  # pymupdf4llm —— 始终使用 pymupdf4llm（必须先安装：uv add pymupdf4llm）。
  #               标题/表格抽取更好；对多数文件更快。
  # markitdown  —— 始终使用 MarkItDown（原有行为，无额外依赖）。
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # 默认禁用宿主机 bash 执行，因为 LocalSandboxProvider 对 shell 访问
  # 不是一个安全的隔离边界。仅在完全可信、单用户的本地工作流中启用。
  allow_host_bash: false
  # 可选：将额外的宿主机目录挂载到沙箱中。
  # 每个挂载将宿主机路径映射到 agent 可访问的虚拟容器路径。
  # 注意：在 `make up`（docker-compose）下使用 LocalSandboxProvider 时，
  # host_path 是从 deer-flow-gateway 容器内部检查的——你还必须在
  # docker/docker-compose.yaml 的 services.gateway.volumes 中绑定挂载
  # 相同目录，此挂载才能生效（参见 issue #3244）。
  # mounts:
  #   - host_path: /home/user/my-project    # 绝对路径；Docker 模式下请参见上面说明
  #     container_path: /mnt/my-project     # 沙箱内的虚拟路径
  #     read_only: true                     # 挂载是否只读（默认：false）

  # 工具输出截断限制（字符）。
  # bash 使用中间截断（首尾保留），因为错误可能出现在输出的任意位置。
  # read_file 和 ls 使用头部截断，因为它们的内容是前置加载的。
  # 设为 0 可禁用截断。
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# 选项 2：基于容器的 AIO 沙箱
# 在隔离容器中执行命令（Docker 或 Apple Container）
# 在 macOS 上：可用时自动优先使用 Apple Container，否则回退到 Docker
# 在其他平台：使用 Docker
# 取消注释以启用：
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#
#   # 可选：要使用的容器镜像（Docker 与 Apple Container 通用）
#   # 默认：enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
#   # 推荐：enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest（同时适配 x86_64 与 arm64）
#   # 自定义镜像应继承默认镜像，或实现与 agent-sandbox 使用的相同
#   # AIO 沙箱 HTTP API。详见 backend/docs/CONFIGURATION.md。
#   # image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
#
#   # 可选：沙箱容器的基础端口（默认：8080）
#   # port: 8080

#   # 可选：并发沙箱容器的最大数量（默认：3）
#   # 达到上限时，最近最少使用的沙箱会被驱逐以腾出空间。
#   # 请使用正整数；省略此字段则使用默认值。
#   # replicas: 3
#
#   # 可选：容器名称前缀（默认：deer-flow-sandbox）
#   # container_prefix: deer-flow-sandbox
#
#   # 可选：从宿主机到容器的额外挂载目录
#   # 注意：技能目录会自动从 skills.path 挂载到 skills.container_path
#   # mounts:
#   #   # 其他自定义挂载
#   #   - host_path: /path/on/host
#   #     container_path: /home/user/shared
#   #     read_only: false
#   #
#   #   # DeerFlow 会向 agent 暴露已配置的 container_path 值，
#   #   # 因此 agent 可以直接读/写诸如 /home/user/shared 这类挂载目录
#
#   # 可选：注入到沙箱容器的环境变量
#   # 以 $ 开头的值会从宿主机环境变量解析
#   # environment:
#   #   NODE_ENV: production
#   #   DEBUG: "false"
#   #   API_KEY: $MY_API_KEY        # 从宿主机的 MY_API_KEY 环境变量读取
#   #   DATABASE_URL: $DATABASE_URL  # 从宿主机的 DATABASE_URL 环境变量读取

# 选项 3：由 provisioner 管理的 AIO 沙箱（docker-compose-dev）
# 每个 sandbox_id 在 k3s 中获得一个专属 Pod，由 provisioner 管理。
# 推荐用于生产或希望获得更好隔离与可扩展性的高级用户：
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#   provisioner_url: http://provisioner:8002
#   # 注意：provisioner 创建的 Pod 使用 provisioner 的 SANDBOX_IMAGE
#   # 环境变量，而不是本配置文件中的 sandbox.image。

# ============================================================================
# Subagents 配置
# ============================================================================
# 配置 subagent 执行的超时时间
# Subagent 是由主 agent 委派任务的后台 worker

# subagents:
#   # 内置 subagent 的默认超时时间（秒，默认：1800 = 30 分钟）。
#   # 自定义 agent 使用各自的 timeout_seconds（默认 900），除非被覆盖。
#   timeout_seconds: 1800
#   # 可选的全局 max-turn 覆盖，应用于所有 subagent。
#   # 内置默认：general-purpose=150，bash=60。不设置则保持原值。
#   # max_turns: 120
#
#   # 可选的按 agent 覆盖（同时作用于内置和自定义 agent）
#   agents:
#     general-purpose:
#       timeout_seconds: 2700  # 45 分钟，用于非常长的深度研究任务
#       max_turns: 250         # 对于非常深入的任务，将其提高到默认 150 以上
#       # model: qwen3:32b     # 使用特定模型（默认：继承自主 agent）
#       # skills:               # 技能白名单（默认：继承所有已启用技能）
#       #   - web-search
#       #   - data-analysis
#     bash:
#       timeout_seconds: 300   # 5 分钟，用于快速命令执行
#       max_turns: 80
#       # skills: []            # bash agent 不加载任何技能
#
#   # 自定义 subagent 类型：定义具有自有提示、工具、技能和模型配置的
#   # 专用 agent。自定义 agent 通过 `task` 工具与内置类型
#   # （general-purpose、bash）一起提供。
#   # custom_agents:
#   #   analysis:
#   #     description: "Data analysis specialist for processing datasets and generating insights"
#   #     system_prompt: |
#   #       You are a data analysis subagent. Focus on:
#   #       - Processing and analyzing datasets
#   #       - Generating visualizations
#   #       - Providing statistical insights
#   #     tools:                  # 工具白名单（null = 继承全部）
#   #       - bash
#   #       - read_file
#   #       - write_file
#   #     skills:                 # 技能白名单（null = 继承全部，[] = 全部禁用）
#   #       - data-analysis
#   #       - visualization
#   #     model: inherit          # 'inherit' 表示使用父 agent 的模型
#   #     max_turns: 80
#   #     timeout_seconds: 600
#
#   # 模型覆盖：默认情况下，subagent 继承主 agent 的模型。
#   # 设置 `model` 可使用不同模型（例如本地 Ollama 模型以节省成本）。
#   # 模型名称必须与上方 `models:` 部分定义的某个名称匹配。

# ============================================================================
# ACP Agents 配置
# ============================================================================
# 为内置 `invoke_acp_agent` 工具配置外部的 ACP 兼容 agent。

# acp_agents:
#   claude_code:
#     # DeerFlow 在此处期望的是 ACP 适配器。标准 `claude` CLI 并不直接说 ACP。
#     # 请单独安装 `claude-agent-acp`，或使用：
#     command: npx
#     args: ["-y", "@zed-industries/claude-agent-acp"]
#     description: Claude Code for implementation, refactoring, and debugging
#     model: null
#     # auto_approve_permissions: false  # 设为 true 可自动批准 ACP 权限请求
#     # env:                             # 可选：注入到 agent 子进程的环境变量
#     #   ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY  # $VAR 从宿主机环境解析
#
#   codex:
#     # DeerFlow 在此处期望的是 ACP 适配器。标准 `codex` CLI 并不直接说 ACP。
#     # 请单独安装 `codex-acp`，或使用：
#     command: npx
#     args: ["-y", "@zed-industries/codex-acp"]
#     description: Codex CLI for repository tasks and code generation
#     model: null
#     # auto_approve_permissions: false  # 设为 true 可自动批准 ACP 权限请求
#     # env:                             # 可选：注入到 agent 子进程的环境变量
#     #   OPENAI_API_KEY: $OPENAI_API_KEY  # $VAR 从宿主机环境解析

# ============================================================================
# 技能（Skills）配置
# ============================================================================
# 为专用 agent 工作流配置技能目录

skills:
  # 宿主机上的技能目录路径（相对于项目根目录或绝对路径）
  # 默认：项目根目录下的 skills
  # 省略此字段时可用 DEER_FLOW_SKILLS_PATH 覆盖。
  # 取消注释以自定义：
  # path: /absolute/path/to/custom/skills

  # 技能在沙箱容器中挂载的路径
  # 在本地和 Docker 沙箱中都被 agent 用于访问技能
  # 默认：/mnt/skills
  container_path: /mnt/skills

# 注意：要限制特定自定义 agent 加载哪些技能，
# 请在该 agent 的 `config.yaml` 中定义 `skills` 列表（例如 `agents/my-agent/config.yaml`）：
# - 省略或 null：加载所有全局启用的技能（默认）
# - []：禁用此 agent 的全部技能
# - ["skill-name"]：仅加载特定技能

# ============================================================================
# 标题生成配置
# ============================================================================
# 自动会话标题生成设置

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null # 使用默认模型（models 列表中的第一个）

# ============================================================================
# 摘要（Summarization）配置
# ============================================================================
# 当接近 token 上限时自动摘要会话历史
# 有助于在长会话中保持上下文而不超出模型限制

summarization:
  enabled: true

  # 用于摘要的模型（null = 使用默认模型）
  # 建议：使用轻量、低成本的模型，例如 "gpt-4o-mini" 或类似模型
  model_name: null

  # 触发条件 —— 至少需要一个
  # 任一阈值达到即触发摘要（OR 逻辑）
  # 可以指定单个触发器，也可以指定触发器列表
  trigger:
    # 当 token 数量达到 32000 时触发
    - type: tokens
      value: 32000
    # 取消注释以在消息数量达到 50 时也触发
    # - type: messages
    #   value: 50
    # 取消注释以在达到模型最大输入 token 的 80% 时触发
    # - type: fraction
    #   value: 0.8

  # 摘要后的上下文保留策略
  # 指定保留多少最近的历史
  keep:
    # 保留最近 10 条消息（推荐）
    type: messages
    value: 10
    # 备选：保留特定的 token 数量
    # type: tokens
    # value: 3000
    # 备选：保留模型最大输入 token 的百分比
    # type: fraction
    # value: 0.3

  # 为摘要准备消息时保留的最大 token 数
  # 设为 null 则跳过裁剪（不建议用于非常长的会话）
  trim_tokens_to_summarize: 15564

  # 自定义摘要提示模板（null = 使用默认 LangChain 提示）
  # 该提示应引导模型抽取重要上下文
  summary_prompt: null

  # 最近加载的技能文件会从摘要中排除，避免在压缩后丢失技能指令。
  # Claude Code 采用类似策略（保留最近约 5 个技能，总 token 约 25k，
  # 每个技能上限约 5k）。将 preserve_recent_skill_count 设为 0 可禁用。
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# 记忆（Memory）配置
# ============================================================================
# 全局记忆机制
# 存储用户上下文和会话历史，用于个性化回复
memory:
  enabled: true
  storage_path: memory.json # 相对于 backend 目录的路径
  debounce_seconds: 30 # 处理排队更新前的等待时间
  model_name: null # 使用默认模型
  max_facts: 100 # 最多存储的事实数量
  fact_confidence_threshold: 0.7 # 存储事实的最小置信度
  injection_enabled: true # 是否将记忆注入系统提示
  max_injection_tokens: 2000 # 记忆注入的最大 token 数
  # 记忆注入预算的 token 计数策略：
  #   tiktoken（默认）—— 精确，但编码的 BPE 数据可能会在首次使用时
  #     从公网端点下载。在网络受限环境下这次下载可能会阻塞很长时间
  #     （参见 issue #3402 / #3429）。请预先缓存编码，或将此项设置为
  #     "char" 以避免下载。
  #   char —— 无网络、CJK 友好的基于字符的估算；永不触发 tiktoken。
  #     预算稍欠精确，但不产生任何网络 I/O。
  token_counting: tiktoken
  # Guaranteed injection: fact categories that bypass the regular token budget
  # and draw from a reserved allowance, so high-signal corrections (e.g.
  # "don't use `pip`, use `uv`") survive even when the budget is tight.
  #   guaranteed_categories - list of fact categories to guarantee. Pass [] to
  #     disable; defaults to ["correction"].
  #   guaranteed_token_budget - token ceiling for guaranteed facts. In the
  #     common case the total injection stays within ``max_injection_tokens``
  #     (guaranteed lines displace regular ones); the allowance becomes
  #     additive only when guaranteed lines alone would overflow
  #     ``max_injection_tokens``, in which case the safety-truncation ceiling
  #     is raised accordingly.
  guaranteed_categories:
    - correction
  guaranteed_token_budget: 500

# ============================================================================
# 自定义 Agent 管理 API
# ============================================================================
# 控制 HTTP gateway 是否暴露自定义 agent 的 SOUL/USER.md 管理接口。
# 除非 gateway 处于受信任的、需认证的管理边界之后，否则请保持禁用。
agents_api:
  enabled: false

# ============================================================================
# 技能自我演化配置
# ============================================================================
# 允许 agent 在 skills/custom/ 下自主创建并改进技能。
skill_evolution:
  enabled: false # 设为 true 以允许 agent 在 skills/custom 下进行写入
  moderation_model_name: null # 用于基于 LLM 的安全扫描的模型（null = 使用默认模型）

# ============================================================================
# Checkpointer 配置（已废弃 —— 请改用 `database`）
# ============================================================================
# 旧的独立 checkpointer 配置。保留以向后兼容。
# 推荐使用下方统一的 `database` 部分，它通过一个后端设置同时驱动
# LangGraph checkpointer 和 DeerFlow 应用数据（runs、feedback、events）。
#
# 如果同时存在 `checkpointer` 和 `database`，则仅在 LangGraph 状态
# 持久化方面以 `checkpointer` 为准。
#
# checkpointer:
#   type: sqlite
#   connection_string: checkpoints.db
#
# checkpointer:
#   type: postgres
#   connection_string: postgresql://user:password@localhost:5432/deerflow

# ============================================================================
# 数据库
# ============================================================================
# LangGraph checkpointer 与 DeerFlow 应用数据（runs、threads 元数据、
# feedback 等）的统一存储后端。
#
# backend: memory  -- 不持久化，重启后数据丢失
# backend: sqlite  -- 单节点部署，文件位于 sqlite_dir
# backend: postgres -- 生产多节点部署
#
# 如果 config.yaml 中省略或留空此部分，DeerFlow 将使用：
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# SQLite 模式对 checkpointer 与应用数据使用单一的 deerflow.db 文件，
# 启用 WAL 日志模式。
#
# Postgres 模式：将连接 URL 放入 .env 作为 DATABASE_URL，
# 然后在此处用 $DATABASE_URL 引用。
#
# 安装驱动 —— Issue #2754 的修复在所有代码路径中加入了 `UV_EXTRAS`：
#   本地       `make dev` 会从下方的 `database.backend: postgres` 自动检测，
#              并在每次重启时给 `uv sync` 传入 `--extra postgres`，因此
#              extra 不会再被清掉。如需显式启用（或叠加多个 extras 如
#              `postgres,ollama`），在项目根 .env 中设置：
#                  UV_EXTRAS=postgres
#   Docker 开发 `make docker-start` 通过 `env_file` 从项目根 .env 读取
#              `UV_EXTRAS`。设置：
#                  UV_EXTRAS=postgres
#              此处也支持多个 extras（`postgres,ollama`）—— 参见
#              docker/dev-entrypoint.sh。
#   Docker 镜像 构建参数 `UV_EXTRAS=postgres docker compose build` —— 构建时
#              仅支持单个 extra（backend/Dockerfile 将该值作为一个 token 传给
#              `--extra`）。
#
# 首次引导（在 `make dev` 之前）：
#   cd backend && uv sync --all-packages --extra postgres
#   （--all-packages 会将 extra 传递给 workspace 成员 —— 参见 PR #2584）
#
# 注意：当同时配置了 `checkpointer` 和 `database` 时，
# LangGraph 状态持久化以 `checkpointer` 为准。
# 如果使用 `database`，可以删除 `checkpointer` 部分。
# database:
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# database:
#   backend: postgres
#   postgres_url: $DATABASE_URL
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# ============================================================================
# 运行事件（Run Events）配置
# ============================================================================
# 运行事件（消息 + 执行追踪）的存储后端。
#
# backend: memory  -- 不持久化，重启后数据丢失（默认）
# backend: db      -- 通过 ORM 写入 SQL 数据库，具备完整查询能力（生产）
# backend: jsonl   -- 追加式 JSONL 文件（轻量的单节点持久化）
#
# run_events:
#   backend: memory
#   max_trace_content: 10240    # 追踪内容截断阈值（db 后端，字节）
#   track_token_usage: true     # 累计 token 计数到 RunRow
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true

# ============================================================================
# 用户自有 IM 渠道连接
# ============================================================================
# 允许已登录用户从 DeerFlow 前端连接他们自己的 IM 账号，
# 同时复用下方现有的 `channels` 运行时配置。
#
# 安全说明：
# - 不需要公网 IP、OAuth 回调 URL 或 provider webhook。
# - Provider 的 bot/app 凭证仍保留在 `channels.*` 中。
# - `channel_connections` 保存每个用户的绑定关系和一次性连接码。
# - 当配置了 `bot_username` 时，Telegram 使用 deep link。
# - Slack、Discord、Feishu、DingTalk、WeChat 和 WeCom 通过已运行的
#   bot/app 使用 `/connect <code>`。
#
# channel_connections:
#   enabled: false
#   # 安全性：除非你有意启用旧的 open-bot 行为，否则请保持启用。
#   # 禁用此项会允许未绑定的外部 IM 用户创建 DeerFlow 的 threads/runs。
#   require_bound_identity: true
#
#   telegram:
#     enabled: false
#     bot_username: $TELEGRAM_BOT_USERNAME
#
#   slack:
#     enabled: false
#
#   discord:
#     enabled: false
#
#   feishu:
#     enabled: false
#
#   dingtalk:
#     enabled: false
#
#   wechat:
#     enabled: false
#
#   wecom:
#     enabled: false

# ============================================================================
# IM 渠道配置
# ============================================================================
# 将 DeerFlow 接入外部消息平台。
# 所有渠道均使用出站连接（WebSocket 或轮询）—— 无需公网 IP。

# channels:
#   # 用于 thread/message 管理的 LangGraph 兼容 Gateway API base URL（默认：http://localhost:8001/api）
#   # 对于 Docker 部署，请使用 Docker 服务名而非 localhost：
#   #   langgraph_url: http://gateway:8001/api
#   #   gateway_url: http://gateway:8001
#   langgraph_url: http://localhost:8001/api
#   # 用于 /models、/memory 等辅助查询的 Gateway API URL（默认：http://localhost:8001）
#   gateway_url: http://localhost:8001
#   #
#   # Docker Compose 注意事项：
#   # 如果 channels 运行在 gateway 容器内部，请使用容器 DNS 名而非 localhost，例如：
#   # langgraph_url: http://gateway:8001/api
#   # gateway_url: http://gateway:8001
#   # 也可设置 DEER_FLOW_CHANNELS_LANGGRAPH_URL / DEER_FLOW_CHANNELS_GATEWAY_URL。
#
#   # 可选：所有 IM 渠道的默认移动端/会话设置
#   session:
#     assistant_id: lead_agent  # 或某个自定义 agent 名称；自定义 agent 通过 lead_agent + agent_name 路由
#     config:
#       recursion_limit: 100
#     context:
#       thinking_enabled: true
#       is_plan_mode: false
#       subagent_enabled: false
#
#   feishu:
#     enabled: false
#     app_id: $FEISHU_APP_ID
#     app_secret: $FEISHU_APP_SECRET
#     # domain: https://open.feishu.cn       # 中国（默认）
#     # domain: https://open.larksuite.com   # 国际
#
#   slack:
#     enabled: false
#     bot_token: $SLACK_BOT_TOKEN     # xoxb-...
#     app_token: $SLACK_APP_TOKEN     # xapp-...（Socket Mode）
#     allowed_users: []               # 为空 = 允许所有；也可填单个 Slack 用户 ID 字符串，例如 U123456，但推荐列表形式
#
#   telegram:
#     enabled: false
#     bot_token: $TELEGRAM_BOT_TOKEN
#     allowed_users: []               # 为空 = 允许所有
#
#   wechat:
#     enabled: false
#     bot_token: $WECHAT_BOT_TOKEN
#     ilink_bot_id: $WECHAT_ILINK_BOT_ID
#     # 可选：在缺少 bot_token 时允许首次 QR 引导
#     qrcode_login_enabled: true
#     # 可选：提供时作为 iLink-App-Id 请求头发送
#     ilink_app_id: ""
#     # 可选：提供时作为 SKRouteTag 请求头发送
#     route_tag: ""
#     allowed_users: []               # 为空 = 允许所有
#     # 可选：长轮询超时（秒）
#     polling_timeout: 35
#     # 可选：当 qrcode_login_enabled 为 true 时的 QR 轮询间隔（秒）
#     qrcode_poll_interval: 2
#     # 可选：QR 引导超时（秒）
#     qrcode_poll_timeout: 180
#     # 可选：在 gateway 容器卷下持久化 getupdates 游标
#     state_dir: ./.deer-flow/wechat/state
#     # 可选：下载入站图片前的最大尺寸（字节），超过则跳过下载
#     max_inbound_image_bytes: 20971520
#     # 可选：上传出站图片前的最大尺寸（字节），超过则跳过上传
#     max_outbound_image_bytes: 20971520
#     # 可选：下载入站文件前的最大尺寸（字节），超过则跳过下载
#     max_inbound_file_bytes: 52428800
#     # 可选：上传出站文件前的最大尺寸（字节），超过则跳过上传
