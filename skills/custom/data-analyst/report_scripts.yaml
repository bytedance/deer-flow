# Report Script Registry — data-analyst
# Contract surface for the AI Report Custom Template platform
# (see docs/plans/2026-05-14-ai-report-custom-template-design.md §9.1.1).
#
# - Each entry below is the canonical declaration of one report script's
#   CLI args, output files, and resource limits.
# - The platform's Script Registry loader discovers this file at skill
#   enablement time, validates it, and exposes the scripts to DSL templates
#   under the namespace "data-analyst/{script_name}".
# - Daily/weekly/monthly report scripts have been migrated to their own
#   skills (daily-report, weekly-report, monthly-report). Monitoring
#   scripts (trend/anomaly/KPI/correlation/spectrum) have been migrated
#   to monitoring-analysis. This registry retains failure, closure, and
#   inspection scripts.

schema_version: "1"

scripts:
  list_equipment:
    entry: scripts/list_equipment.py
    kind: [form_options]
    description: "查询设备目录、区域分组、可用 KPI（用于动态 options_source）"
    args_schema:
      type:
        type: enum
        values: [all, static_equipment, rotating_machinery, pump, reciprocating_machinery]
        default: all
        description: "设备类型"
      scope:
        type: enum
        values: [all, area, specific]
        default: all
        description: "查询模式"
      filter:
        type: string
        max_length: 200
        description: "区域名称或设备 ID 过滤条件（CSV）"
      limit:
        type: integer
        min: 1
        max: 10000
        default: 50
        description: "返回设备数量上限"
    output_files:
      - id: list_equipment
        path: "{run_output_dir}/data/list_equipment.json"
        description: "设备列表 + available_kpis（供 options_source 引用）"
    outputs_schema:
      equipment:
        type: array
        description: "设备列表，每条含 id/name/area/type"
      available_kpis:
        type: array
        description: "可用 KPI 描述符列表"
      area_counts:
        type: object
        description: "按 area 聚合的设备数量"
    timeout_seconds: 30
    max_output_bytes: 10485760   # 10 MB

  # ---------------------------------------------------------------------------
  # Phase 6 — Failure / Closure / Inspection
  # All scripts below are demo stubs delivering deterministic synthetic data so
  # the builtin DSL templates can be exercised end-to-end. They will be replaced
  # by real data-source integrations as those become available.
  # ---------------------------------------------------------------------------

  query_fault_context:
    entry: scripts/query_fault_context.py
    kind: [data_step]
    description: "查询故障前后运行数据、告警、工单、维护记录"
    args_schema:
      fault_time:
        type: date
        required: true
        description: "故障发生日 YYYY-MM-DD"
      equipment_id:
        type: string
        required: true
        max_length: 64
        pattern: "^[A-Za-z0-9_-]+$"
        description: "故障对象 ID"
      equipment_name:
        type: string
        max_length: 200
        description: "故障对象名称（缺省时按 ID 渲染）"
      symptom:
        type: string
        max_length: 200
        description: "现象描述"
      include_related_equipment:
        type: flag
        description: "是否包含关联设备"
    output_files:
      - id: fault_context
        path: "{run_output_dir}/data/fault_context.json"
        description: "故障上下文（operations/alarms/work_orders/maintenance_records）"
    timeout_seconds: 120
    max_output_bytes: 52428800

  build_fault_timeline:
    entry: scripts/build_fault_timeline.py
    kind: [transform]
    description: "按时间排序事件，生成故障时间线"
    args_schema:
      input:
        type: file_path
        required: true
        description: "fault_context.json 路径"
    output_files:
      - id: fault_timeline
        path: "{run_output_dir}/data/fault_timeline.json"
        description: "已排序的事件时间线"
    timeout_seconds: 30
    max_output_bytes: 10485760

  diagnosis_features:
    entry: scripts/diagnosis_features.py
    kind: [transform]
    description: "生成诊断特征（证据链、规则匹配、候选根因）"
    args_schema:
      input:
        type: file_path
        required: true
        description: "fault_context.json 路径"
      rules_skill:
        type: enum
        values: [vibration-fault-diagnosis, pump-fault-diagnosis, reciprocating-fault-diagnosis]
        default: vibration-fault-diagnosis
        description: "规则集名称"
    output_files:
      - id: diagnosis_features
        path: "{run_output_dir}/data/diagnosis_features.json"
        description: "诊断特征（evidence_chain/rule_matches/candidate_root_causes）"
    timeout_seconds: 60
    max_output_bytes: 10485760

  query_failure_data:
    entry: scripts/query_failure_data.py
    kind: [data_step]
    description: "查询失效对象相关运行、维修、检验、备件和环境数据"
    args_schema:
      asset_id:
        type: string
        required: true
        max_length: 64
        pattern: "^[A-Za-z0-9_-]+$"
      asset_name:
        type: string
        max_length: 200
        description: "失效对象名称（缺省时按 ID 渲染）"
      failure_mode:
        type: string
        required: true
        max_length: 200
        description: "失效模式描述"
      analysis_method:
        type: enum
        values: [five_why, fishbone, fmea]
        default: five_why
        description: "分析方法"
      evidence_range:
        type: string
        max_length: 64
        description: "证据时间范围"
    output_files:
      - id: failure_data
        path: "{run_output_dir}/data/failure_data.json"
        description: "失效分析输入数据"
    timeout_seconds: 120
    max_output_bytes: 52428800

  failure_analysis:
    entry: scripts/failure_analysis.py
    kind: [transform]
    description: "基于指定方法（5Why/鱼骨图/FMEA）生成根因分析结构"
    args_schema:
      input:
        type: file_path
        required: true
        description: "failure_data.json 路径"
    output_files:
      - id: failure_analysis
        path: "{run_output_dir}/data/failure_analysis.json"
        description: "根因/改进措施/验证计划（§13.2 证据）"
    timeout_seconds: 60
    max_output_bytes: 10485760

  query_closure_items:
    entry: scripts/query_closure_items.py
    kind: [data_step]
    description: "查询问题单、整改措施、责任人、计划和完成状态"
    args_schema:
      issue_ids:
        type: csv
        items: {pattern: "^[A-Za-z0-9_-]+$"}
        max_items: 500
        required: true
        description: "问题单 ID 列表"
      owner_department:
        type: string
        max_length: 100
        description: "责任部门"
      verification_period:
        type: string
        max_length: 64
        description: "验证周期（如 2026-04-01..2026-05-01）"
    output_files:
      - id: closure_items
        path: "{run_output_dir}/data/closure_items.json"
        description: "问题单及整改措施明细"
    timeout_seconds: 60
    max_output_bytes: 20971520

  closure_summary:
    entry: scripts/closure_summary.py
    kind: [transform]
    description: "汇总执行情况、验证结果、未闭项和闭环结论"
    args_schema:
      input:
        type: file_path
        required: true
        description: "closure_items.json 路径"
    output_files:
      - id: closure_summary
        path: "{run_output_dir}/data/closure_summary.json"
        description: "闭环报告渲染数据"
    timeout_seconds: 30
    max_output_bytes: 10485760

  query_inspection:
    entry: scripts/query_inspection.py
    kind: [data_step]
    description: "查询指定日期、路线、区域的巡检记录"
    args_schema:
      inspection_date:
        type: date
        required: true
        description: "巡检日期 YYYY-MM-DD"
      route:
        type: string
        max_length: 100
        description: "巡检路线"
      area:
        type: string
        max_length: 100
        description: "巡检区域"
      severity_min:
        type: enum
        values: [low, medium, high]
        default: low
        description: "异常等级下限"
    output_files:
      - id: inspection_data
        path: "{run_output_dir}/data/inspection_data.json"
        description: "巡检原始数据 (records + attachments)"
    timeout_seconds: 60
    max_output_bytes: 20971520

  inspection_summary:
    entry: scripts/inspection_summary.py
    kind: [transform]
    description: "汇总异常等级、设备分布、整改建议"
    args_schema:
      input:
        type: file_path
        required: true
        description: "inspection_data.json 路径"
    output_files:
      - id: inspection_summary
        path: "{run_output_dir}/data/inspection_summary.json"
        description: "巡检概况与异常清单"
    timeout_seconds: 30
    max_output_bytes: 10485760

  inspection_attachment_summary:
    entry: scripts/inspection_attachment_summary.py
    kind: [transform]
    description: "汇总照片、附件和备注信息"
    args_schema:
      input:
        type: file_path
        required: true
        description: "inspection_data.json 路径"
    output_files:
      - id: inspection_attachments
        path: "{run_output_dir}/data/inspection_attachments.json"
        description: "照片/备注汇总"
    timeout_seconds: 30
    max_output_bytes: 10485760

