# 设备类型诊断配置
# 定义每种设备类型对应的规则集、故障代码和可视化模板

kinds:
  # 旋转设备
  centrifugal_compressor:
    rules_skill: vibration-fault-diagnosis
    family: rotating
    focus_codes:
      - unbalance_1x
      - unbalance_2x
      - misalignment_angular
      - misalignment_parallel
      - misalignment_combined
      - oil_whirl
      - oil_whip
      - rotor_rub
      - rotor_crack
      - bearing_defect
      - gear_mesh
      - electrical_fault
    viz_templates:
      - orbit_plot
      - spectrum_plot
      - trend_plot

  steam_turbine:
    rules_skill: vibration-fault-diagnosis
    family: rotating
    focus_codes:
      - unbalance_1x
      - unbalance_2x
      - misalignment_angular
      - misalignment_parallel
      - oil_whirl
      - oil_whip
      - rotor_rub
      - rotor_crack
      - bearing_defect
      - blade_pass
      - electrical_fault
    viz_templates:
      - orbit_plot
      - spectrum_plot
      - trend_plot
      - bode_plot

  # 泵类设备
  centrifugal_pump:
    rules_skill: pump-fault-diagnosis
    family: pump
    focus_codes:
      - cavitation
      - bearing_defect
      - seal_leak
      - impeller_damage
      - misalignment
      - unbalance
      - recirculation
      - surge
      - mechanical_looseness
    viz_templates:
      - pump_performance_curve
      - spectrum_plot
      - trend_plot

  positive_displacement_pump:
    rules_skill: pump-fault-diagnosis
    family: pump
    focus_codes:
      - cavitation
      - bearing_defect
      - seal_leak
      - valve_leak
      - piston_ring_wear
      - misalignment
      - unbalance
      - mechanical_looseness
    viz_templates:
      - pump_performance_curve
      - spectrum_plot
      - trend_plot

  # 往复设备
  reciprocating_compressor:
    rules_skill: reciprocating-fault-diagnosis
    family: reciprocating
    focus_codes:
      - suction_valve_leak
      - discharge_valve_leak
      - piston_ring_wear
      - rider_band_wear
      - rod_packing_leak
      - crosshead_wear
      - crankshaft_bearing
      - connecting_rod_bearing
      - pulsation
      - liquid_slugs
      - misalignment
    viz_templates:
      - pv_diagram
      - rod_position_plot
      - spectrum_plot
      - trend_plot

  # 齿轮箱
  gearbox:
    rules_skill: vibration-fault-diagnosis
    family: rotating
    focus_codes:
      - gear_mesh
      - bearing_defect
      - misalignment
      - unbalance
      - mechanical_looseness
      - gear_wear
      - gear_crack
    viz_templates:
      - orbit_plot
      - spectrum_plot
      - trend_plot

# 默认配置（用于未识别的设备类型）
default:
  rules_skill: vibration-fault-diagnosis
  family: rotating
  focus_codes:
    - unbalance_1x
    - misalignment
    - bearing_defect
    - mechanical_looseness
  viz_templates:
    - spectrum_plot
    - trend_plot
