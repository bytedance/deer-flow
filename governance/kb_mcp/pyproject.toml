[project]
name = "governance-kb-mcp"
version = "0.1.0"
description = "RAG knowledge base MCP server for DeerFlow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0",
    "chromadb>=0.6.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
kb-mcp = "governance_kb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
