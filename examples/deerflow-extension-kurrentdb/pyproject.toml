[project]
name = "deerflow-extension-kurrentdb"
version = "0.1.0"
description = "KurrentDB event-sourced memory storage and run-event store for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.14,<0.3", "deerflow-harness>=2.1,<3", "kurrentdbclient>=1.3,<2", "kurrent-agent-schema>=0.5,<1"]

[project.entry-points."deerflow.extensions"]
kurrentdb = "deerflow_extension_kurrentdb:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_kurrentdb"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
