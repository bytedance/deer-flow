[project]
name = "deerflow-extension-workspace-search"
version = "0.1.0"
description = "Visible conversation full-text search for DeerFlow"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.12", "sqlalchemy>=2", "aiosqlite>=0.20"]

[project.entry-points."deerflow.extensions"]
workspace-search = "deerflow_workspace_search:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_workspace_search"]
