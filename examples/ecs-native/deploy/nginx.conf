map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    # Overwrite client forwarding headers. Gateway trusts only this fixed peer IP.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded '';
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    location /health { proxy_pass http://gateway:8001; }
    location /api/langgraph/ { proxy_pass http://gateway:8001/api/; }
    location /api/ { proxy_pass http://gateway:8001; }
    location /execution/ {
        # Ordinary MCP retains SDK loopback Host protection behind this sole TLS entry.
        proxy_set_header Host localhost:8003;
        proxy_pass http://mcp:8003/;
    }
    location / { proxy_pass http://frontend:3000; }
}
