[project]
name = "deerflow-extension-knowledge"
version = "0.1.0"
description = "Offline synthetic read-only knowledge provider for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3", "deerflow-harness>=2.1,<3"]

[project.entry-points."deerflow.extensions"]
knowledge-example = "deerflow_extension_knowledge:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_knowledge"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
