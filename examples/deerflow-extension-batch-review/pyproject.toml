[project]
name = "deerflow-extension-batch-review"
version = "0.1.0"
description = "Read saved native batch reports and captured evidence through public host contracts"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.6,<0.3"]

[project.entry-points."deerflow.extensions"]
batch-review = "deerflow_extension_batch_review:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_batch_review"]
