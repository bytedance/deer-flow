[project]
name = "deerflow-extension-knowledge-management"
version = "0.1.0"
description = "Optional provider-owned knowledge ingestion and processing for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3", "fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.entry-points."deerflow.extensions"]
knowledge-management = "deerflow_extension_knowledge_management:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_knowledge_management"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
