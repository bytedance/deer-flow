[project]
name = "deerflow-extension-jev-context"
version = "0.1.0"
description = "Opt-in Jev pruning of old read-only tool results for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "deerflow-extension-api>=0.2.2,<0.3",
    "langchain>=1.2,<2",
    "langchain-core>=1.2,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.entry-points."deerflow.extensions"]
jev-context = "deerflow_extension_jev_context:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_jev_context"]
