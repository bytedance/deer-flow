[project]
name = "deerflow-extension-workflows"
version = "0.1.0"
description = "Opt-in constrained script orchestration of public DeerFlow AgentRuns"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.5,<0.3", "quickjs==1.19.4"]

[project.entry-points."deerflow.extensions"]
workflows = "deerflow_extension_workflows:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_workflows"]
