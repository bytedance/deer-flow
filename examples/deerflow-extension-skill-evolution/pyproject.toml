[project]
name = "deerflow-extension-skill-evolution"
version = "0.18.0"
description = "Agent self-evolution for DeerFlow, with annotation-driven Skill evolution and room for future modules"
readme = "README.md"
requires-python = ">=3.12"
# The host-side mutation pipeline (validation, scanning, storage, history,
# projection, cache invalidation) is imported lazily from the running
# DeerFlow host at install time; it is deliberately NOT a packaged
# dependency. Declared dependencies are limited to the public contract and
# the middleware framework this package directly imports. The 0.2.8 floor
# matches the contract this package was written and tested against; the
# optional skill_mutations handle (0.2.7+) degrades gracefully by design.
dependencies = [
    "deerflow-extension-api>=0.2.8,<0.3",
    "langchain>=1.3,<2",
    "pyyaml>=6,<7",
]

[project.entry-points."deerflow.extensions"]
skill-evolution = "deerflow_extension_skill_evolution:install"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_skill_evolution"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deerflow_extension_skill_evolution"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
