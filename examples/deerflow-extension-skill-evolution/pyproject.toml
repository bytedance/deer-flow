[project]
name = "deerflow-extension-skill-evolution"
version = "0.1.0"
description = "Example: evidence-gated skill self-evolution through the host SkillMutationService contract"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "deerflow-extension-api>=0.2.11,<0.3",
    "fastapi>=0.115.0,<1",
    "pydantic>=2.12,<3",
]

[project.entry-points."deerflow.extensions"]
skill-evolution = "deerflow_extension_skill_evolution:install"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_skill_evolution"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deerflow_extension_skill_evolution"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
