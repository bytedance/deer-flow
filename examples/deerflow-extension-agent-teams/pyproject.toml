[project]
name = "deerflow-extension-agent-teams"
version = "0.1.0"
description = "Peer collaboration between full DeerFlow Custom Agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.5,<0.3", "langchain>=1.2,<2"]

[project.entry-points."deerflow.extensions"]
agent-teams = "deerflow_extension_agent_teams:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_agent_teams"]
