[project]
name = "deerflow-extension-jev-screening"
version = "0.1.0"
description = "Opt-in configured middleware for advisory remote tool result screening"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2.9,<1.3",
    "pydantic>=2.12,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_jev_screening"]
