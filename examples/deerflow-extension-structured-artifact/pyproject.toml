[project]
name = "deerflow-extension-structured-artifact"
version = "0.1.0"
description = "Read-only retrieval example using DeerFlow's structured ModelTool artifact channel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.6,<0.3"]

[project.entry-points."deerflow.extensions"]
structured-artifact = "deerflow_extension_structured_artifact:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_structured_artifact"]
