[project]
name = "deerflow-extension-example"
version = "0.1.0"
description = "A compact standalone example covering every DeerFlow extension contribution kind"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-extension-api>=0.2,<0.3",
    "fastapi>=0.115.0,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2.9,<1.3",
]

[project.entry-points."deerflow.extensions"]
example = "deerflow_extension_example:install"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_example"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deerflow_extension_example"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
