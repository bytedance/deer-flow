[project]
name = "deerflow-extension-office-preview"
version = "0.1.0"
description = "Local Office file previews for DeerFlow artifact panels"
requires-python = ">=3.12"
license = "MIT"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["deerflow-extension-api>=0.2.3,<0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.entry-points."deerflow.extensions"]
office_preview = "deerflow_extension_office_preview:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_office_preview"]
