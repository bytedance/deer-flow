[project]
name = "deerflow-extension-lightrag"
version = "0.1.0"
description = "Read-only LightRAG document and entity relation provider for DeerFlow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3", "deerflow-harness>=2.1,<3", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.entry-points."deerflow.extensions"]
lightrag = "deerflow_extension_lightrag:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_lightrag"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
