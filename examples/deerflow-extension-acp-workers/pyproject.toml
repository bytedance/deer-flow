[project]
name = "deerflow-extension-acp-workers"
version = "0.1.0"
description = "ACP workers for DeerFlow delegated tasks"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.12,<0.3", "deerflow-harness>=2.3.0.dev0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[project.entry-points."deerflow.extensions"]
acp-workers = "deerflow_extension_acp_workers:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_acp_workers"]
