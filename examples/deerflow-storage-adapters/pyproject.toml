[project]
name = "deerflow-storage-adapters"
version = "0.1.0"
description = "Synchronous SQLAlchemy storage adapters for application extensions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
mysql = ["pymysql[rsa]>=1.1,<2"]
test = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: requires a disposable MySQL test database"]
