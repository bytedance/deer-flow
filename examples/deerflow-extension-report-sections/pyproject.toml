[project]
name = "deerflow-extension-report-sections"
version = "0.1.0"
description = "Sectioned long-form report writing with assembled artifact delivery for DeerFlow"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.8,<0.3"]

[project.entry-points."deerflow.extensions"]
report-sections = "deerflow_extension_report_sections:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_report_sections"]
