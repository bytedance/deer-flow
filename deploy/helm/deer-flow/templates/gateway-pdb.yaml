{{- /*
  PodDisruptionBudget for the gateway. Rendered only when more than one
  replica runs: with a single replica a budget of 1 would block every node
  drain, and with several it keeps at least one Pod serving (and renewing its
  run leases) while nodes are drained.
*/ -}}
{{- $pdb := .Values.gateway.podDisruptionBudget | default dict -}}
{{- if and $pdb.enabled (gt (int .Values.gateway.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "deer-flow.fullname" . }}-gateway
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "deer-flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
