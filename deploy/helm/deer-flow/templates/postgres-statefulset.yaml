{{- if .Values.postgresql.enabled -}}
{{- $name := include "deer-flow.postgresFullname" . -}}
{{- $repository := .Values.postgresql.image.repository -}}
{{- $image := printf "%s:%v" $repository .Values.postgresql.image.tag -}}
{{- $tag := first (splitList "@" (toString .Values.postgresql.image.tag)) -}}
{{- $hubPostgres := has $repository (list "postgres" "docker.io/postgres" "index.docker.io/postgres") -}}
{{- $libraryPostgres := regexMatch `^((localhost|[^/]*[.:][^/]*)/)?library/postgres$` $repository -}}
{{- $autoDataDirectory := and (or $hubPostgres $libraryPostgres) (regexMatch `^16(\.[0-9]+)?$` $tag) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "deer-flow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "deer-flow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- include "deer-flow.imagePullSecrets" . | nindent 6 }}
      securityContext:
        # Non-root: postgres:16 ships a `postgres` user (uid 999). The official
        # entrypoint detects non-root, skips the chown/gosu dance, and runs
        # initdb as 999. fsGroup 999 makes the data PVC group-writable.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tcp-postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "deer-flow.databaseUrlSecret" . }}
                  key: postgres-password
            {{- if dig "useChartDataDirectory" $autoDataDirectory .Values.postgresql.image }}
            - name: PGDATA
              value: /var/run/postgresql/deerflow-pgdata
          command:
            - /bin/sh
            - -ec
            - |
              root=/var/lib/postgresql/data
              target="$root/pgdata"
              if [ -e "$root/PG_VERSION" ] || [ -d "$root/base" ] || [ -d "$root/global" ] || [ -d "$root/pg_wal" ]; then
                if [ ! -s "$root/PG_VERSION" ] || [ -s "$target/PG_VERSION" ]; then
                  echo "Cannot select a PostgreSQL database. Inspect $root and $target before restarting." >&2
                  exit 1
                fi
                target=$root
              elif [ -L "$target" ]; then
                echo "Expected a database directory at $target, found a symbolic link." >&2
                exit 1
              elif [ ! -s "$target/PG_VERSION" ]; then
                existing=$(find "$root" -mindepth 1 -maxdepth 1 ! -name pgdata ! -name lost+found \
                  ! \( -type d -name .snapshot \) -print -quit)
                if [ -n "$existing" ]; then
                  echo "Refusing to initialize a new database on a nonempty volume (found $existing)." >&2
                  exit 1
                fi
                mkdir -p "$target"
              fi
              # Keep the server and tools launched through kubectl exec on the same database.
              ln -sfnT "$target" "$PGDATA"
              exec docker-entrypoint.sh postgres
            {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.postgresql.primary.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgresql.primary.persistence.enabled }}
      # emptyDir fallback (testing only — data is lost on pod restart).
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.primary.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "deer-flow.dataClaimLabels" (dict "root" . "name" $name "component" "postgres") | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.postgresql.primary.persistence.accessMode | quote }}
        resources:
          requests:
            storage: {{ .Values.postgresql.primary.persistence.size | quote }}
        {{- with .Values.postgresql.primary.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end -}}
